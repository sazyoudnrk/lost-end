<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>RPGエディタ</title>
<style>
:root{--bg:#16171d;--bg2:#1f2129;--bg3:#2a2d38;--fg:#e8e8ef;--mut:#9a9cab;--ac:#5b8cff;--dg:#ff5b6b;--bd:#343846}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Hiragino Sans",sans-serif;-webkit-text-size-adjust:100%}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
header{display:flex;align-items:center;gap:6px;padding:6px 8px;padding-top:calc(6px + env(safe-area-inset-top));background:var(--bg2);border-bottom:1px solid var(--bd);flex:none}
header .ttl{flex:1;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{flex:1;min-height:0;position:relative}
.tab{position:absolute;inset:0;display:none;flex-direction:column;overflow:auto;-webkit-overflow-scrolling:touch}
.tab.on{display:flex}
nav{display:flex;background:var(--bg2);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom);flex:none}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:10px 0;font-size:13px}
nav button.on{color:var(--ac)}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation;cursor:pointer}
.btn{background:var(--bg3);border:1px solid var(--bd);border-radius:8px;padding:7px 11px;white-space:nowrap;flex:none}
.btn.on,.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.btn.dg{color:var(--dg)}
.btn.sm{padding:5px 9px;font-size:13px}
.badge.has{background:#e2a84a;color:#000;border-color:#e2a84a;font-weight:700}
.bar{display:flex;gap:6px;padding:6px 8px;overflow-x:auto;align-items:center;flex:none;background:var(--bg2)}
.bar::-webkit-scrollbar{display:none}
select,input[type=text],input[type=number],input[type=password],textarea{font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:7px 9px;width:100%;min-width:0}
textarea{resize:vertical;line-height:1.5}
.fld{display:flex;flex-direction:column;gap:3px;margin:6px 0;flex:1;min-width:0}
.fld>span{font-size:12px;color:var(--mut)}
.fld small{color:var(--mut);font-size:11px}
.row{display:flex;gap:8px;align-items:flex-end}
.card{background:var(--bg2);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin:10px}
.card-t{font-weight:700;margin-bottom:4px}
.chk{display:flex;align-items:center;gap:8px;margin:8px 0}
.chk input{width:20px;height:20px}
.hint{color:var(--mut);font-size:12px;margin:4px 0;line-height:1.5}
.sheet{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .2s}
.sheet.in{transform:none}
.sh-head{display:flex;align-items:center;gap:6px;padding:8px;padding-top:calc(8px + env(safe-area-inset-top));background:var(--bg2);border-bottom:1px solid var(--bd);flex:none}
.sh-title{flex:1;font-weight:700;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.sh-body{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(60px + env(safe-area-inset-bottom))}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:flex-end}
.menu{background:var(--bg2);width:100%;border-radius:14px 14px 0 0;padding:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom));max-height:85vh;overflow:auto}
.menu-t{color:var(--mut);font-size:13px;padding:6px 10px}
.mi{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--bd);padding:13px 12px;font-size:16px}
.mi.danger{color:var(--dg)}
.mi.cancel{text-align:center;color:var(--mut);border:0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:6px}
.grid .mi{border:1px solid var(--bd);border-radius:10px;text-align:center;padding:12px 4px;font-size:14px;background:var(--bg3)}
.cmds{border:1px solid var(--bd);border-radius:8px;overflow:hidden;background:var(--bg)}
.cmd{padding:8px;border-bottom:1px solid var(--bd);font-size:14px;display:flex;gap:6px;align-items:flex-start;min-height:36px}
.cmd .tg{flex:none;font-size:11px;padding:1px 6px;border-radius:4px;color:#fff;margin-top:2px}
.cmd .sm{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap;word-break:break-all}
.cmd.br{color:var(--mut);font-size:13px;min-height:0;padding-top:5px;padding-bottom:5px}
.cmd.add{color:var(--ac)}
.cmd:active{background:var(--bg3)}
#mapWrap{flex:1;min-height:150px;position:relative;overflow:hidden}
#mapCv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#palWrap{height:30vh;overflow:auto;background:#0c0c10;flex:none;-webkit-overflow-scrolling:touch}
#palWrap.range{touch-action:none}
#palCv{display:block;-webkit-touch-callout:none}
.toast{position:fixed;left:50%;top:calc(58px + env(safe-area-inset-top));transform:translateX(-50%);background:#000d;color:#fff;padding:9px 16px;border-radius:20px;z-index:200;font-size:14px;max-width:92vw;pointer-events:none;text-align:center}
.thumb{width:52px;height:52px;object-fit:contain;background:repeating-conic-gradient(#d6c8ec 0 25%,#f1ebf9 0 50%) 0 0/10px 10px;border-radius:6px;image-rendering:pixelated;flex:none}
.list-row{display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--bd)}
.seg{display:flex;border:1px solid var(--bd);border-radius:8px;overflow:hidden;flex:none}
.seg button{background:var(--bg3);border:0;padding:7px 10px}
.seg button.on{background:var(--ac);color:#fff}
.ptabs{display:flex;gap:6px;overflow-x:auto;padding:4px 10px}
canvas{image-rendering:pixelated}
.pe-sw{width:30px;height:30px;border-radius:6px;border:2px solid var(--bd);flex:none;padding:0}
.pe-sw.on{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac)}
</style>
</head>
<body>
<script>
'use strict';
const NS='rpgmk:'+location.pathname.replace(/[^/]*$/,'');
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const clone=o=>JSON.parse(JSON.stringify(o));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const mod=(a,n)=>((a%n)+n)%n;
const pad=n=>String(n).padStart(4,'0'),pad3=n=>String(n).padStart(3,'0');
const DIRN=['下','左','右','上'];
const stamp=()=>{const d=new Date(),z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}`};

/* ===== DOMヘルパ ===== */
function h(t,a,...ch){
  const e=document.createElement(t);
  for(const c of ch.flat(9)){if(c==null||c===false)continue;e.append(c instanceof Node?c:document.createTextNode(String(c)))}
  if(a)for(const k in a){const v=a[k];if(v==null||v===false)continue;
    if(k==='class')e.className=v;else if(k==='style')e.style.cssText=v;
    else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);
    else if(k==='value'||k==='checked')e[k]=v;else e.setAttribute(k,v===true?'':v)}
  return e;
}
const btn=(l,fn,cls)=>h('button',{class:'btn '+(cls||''),onclick:fn},l);
const card=(t,...ch)=>h('div',{class:'card'},t?h('div',{class:'card-t'},t):null,...ch);
let toastEl=null,toastT=null;
function toast(msg,ms=2200){if(!toastEl)toastEl=h('div',{class:'toast'});if(!toastEl.isConnected)document.body.append(toastEl);toastEl.textContent=msg;toastEl.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>toastEl.style.display='none',ms)}
function field(label,input,hint){return h('label',{class:'fld'},label?h('span',null,label):null,input,hint?h('small',null,hint):null)}
function fText(label,o,k,opt={}){const i=h('input',{type:'text',value:o[k]??'',placeholder:opt.ph||'',oninput:()=>{o[k]=i.value;changed();opt.on&&opt.on()}});return field(label,i,opt.hint)}
function fNum(label,o,k,opt={}){const i=h('input',{type:'number',inputmode:'numeric',value:o[k]??0,oninput:()=>{let v=parseInt(i.value,10);if(isNaN(v))return;if(opt.min!=null)v=Math.max(opt.min,v);if(opt.max!=null)v=Math.min(opt.max,v);o[k]=v;changed();opt.on&&opt.on()}});return field(label,i,opt.hint)}
function fArea(label,o,k,opt={}){const i=h('textarea',{rows:opt.rows||4,oninput:()=>{o[k]=i.value;changed()}});i.value=o[k]??'';const f=field(label,i,opt.hint);f._input=i;return f}
function fSel(label,o,k,opts,opt={}){const s=h('select',{onchange:()=>{const v=s.value;o[k]=opt.num?+v:opt.bool?v==='true':v;changed();opt.on&&opt.on()}},opts.map(([v,l])=>h('option',{value:String(v)},l)));s.value=String(o[k]??'');return field(label,s,opt.hint)}
function fChk(label,o,k,opt={}){const i=h('input',{type:'checkbox',checked:!!o[k],onchange:()=>{o[k]=i.checked;changed();opt.on&&opt.on()}});return h('label',{class:'chk'},i,label)}
function insertAt(ta,s){const a=ta.selectionStart??ta.value.length,b=ta.selectionEnd??a;ta.value=ta.value.slice(0,a)+s+ta.value.slice(b);ta.selectionStart=ta.selectionEnd=a+s.length;ta.dispatchEvent(new Event('input'));ta.focus()}
function sheet(title,render,opts={}){
  const el=h('div',{class:'sheet'}),body=h('div',{class:'sh-body'});
  const api={el,body,close,rerender(){const st=body.scrollTop;body.innerHTML='';render(body,api);body.scrollTop=st}};
  const head=h('div',{class:'sh-head'},h('button',{class:'btn sm',onclick:()=>close()},opts.back||'‹ 戻る'),h('div',{class:'sh-title'},title),...(opts.actions||[]).map(([l,fn,cls])=>btn(l,()=>fn(api),'sm '+(cls||'pri'))));
  el.append(head,body);document.body.append(el);requestAnimationFrame(()=>el.classList.add('in'));
  let closed=false;
  function close(){if(closed)return;closed=true;el.classList.remove('in');setTimeout(()=>el.remove(),220);opts.onClose&&opts.onClose()}
  render(body,api);return api;
}
function actionMenu(items,title){
  const ov=h('div',{class:'ov',onclick:e=>{if(e.target===ov)ov.remove()}});
  ov.append(h('div',{class:'menu'},title?h('div',{class:'menu-t'},title):null,
    items.filter(Boolean).map(([l,fn,cls])=>h('button',{class:'mi '+(cls||''),onclick:()=>{ov.remove();fn()}},l)),
    h('button',{class:'mi cancel',onclick:()=>ov.remove()},'キャンセル')));
  document.body.append(ov);
}
function pickFiles(multiple,cb){const i=h('input',{type:'file',accept:'image/*',multiple,style:'display:none'});i.onchange=()=>{const fs=[...i.files];i.remove();if(fs.length)cb(fs)};document.body.append(i);i.click()}

/* ===== 保存 ===== */
function lsGet(k,d){try{const v=localStorage.getItem(NS+k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(NS+k,JSON.stringify(v))}catch(e){toast('端末の保存容量が不足しています',4000)}}
let _db=null;
function db(){return _db||(_db=new Promise((res,rej)=>{const r=indexedDB.open(NS,1);r.onupgradeneeded=()=>r.result.createObjectStore('files');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))}
function idbReq(mode,fn){return db().then(d=>new Promise((res,rej)=>{const tx=d.transaction('files',mode);const rq=fn(tx.objectStore('files'));tx.oncomplete=()=>res(rq.result);tx.onerror=()=>rej(tx.error)}))}
const idbGet=k=>idbReq('readonly',s=>s.get(k)).catch(()=>null);
const idbPut=(k,v)=>idbReq('readwrite',s=>s.put(v,k));
const idbDel=k=>idbReq('readwrite',s=>s.delete(k)).catch(()=>{});
const idbClear=()=>idbReq('readwrite',s=>s.clear()).catch(()=>{});

let G=null,base={h:null,sha:null},pending=new Set(),deleted=new Set(),CLIP=null,curTab='map';
function pretty(o){return JSON.stringify(o,null,1).replace(/\[[-\d,\s]*\]/g,m=>m.includes('\n')?m.replace(/\s+/g,''):m)}
function hash(s){let a=0xdeadbeef,b=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677)}a=Math.imul(a^(a>>>16),2246822507)^Math.imul(b^(b>>>13),3266489909);b=Math.imul(b^(b>>>16),2246822507)^Math.imul(a^(a>>>13),3266489909);return(4294967296*(2097151&b)+(a>>>0)).toString(36)}
let saveT=null;
function changed(){clearTimeout(saveT);saveT=setTimeout(()=>{saveDraft();updateBadge()},500)}
function saveDraft(){clearTimeout(saveT);if(!G)return;lsSet('draft',G);lsSet('base',base);lsSet('pending',[...pending]);lsSet('deleted',[...deleted])}
const jsonDirty=()=>hash(pretty(G))!==base.h;
const changeCount=()=>(jsonDirty()?1:0)+pending.size+deleted.size;
function updateBadge(){const b=$('#badge');if(!b||!G)return;const n=changeCount();b.textContent=n?'☁ '+n:'☁';b.classList.toggle('has',n>0)}
addEventListener('pagehide',saveDraft);
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveDraft()});

/* ===== 画像 ===== */
const imgs={};
function imgFrom(u){return new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=u})}
async function loadImgAsync(path){
  const f=await idbGet(path);
  if(f)return imgFrom(URL.createObjectURL(new Blob([f.buf],{type:f.type||'image/png'})));
  let im=await imgFrom(path+'?t='+Date.now());
  if(!im&&gitReady()){try{const r=await api('/contents/'+encPath(repoPath(path))+'?ref='+encodeURIComponent(gitCfg().branch),{accept:'application/vnd.github.raw+json',raw:true});im=await imgFrom(URL.createObjectURL(await r.blob()))}catch(e){}}
  return im;
}
function getImg(path){if(!path)return null;const e=imgs[path];if(e)return e.img;const ent=imgs[path]={img:null,p:null};ent.p=loadImgAsync(path).then(im=>{ent.img=im;reqDraw();drawPalette();return im});return null}
function imgAsync(path){if(!path)return Promise.resolve(null);getImg(path);return imgs[path].p}
function thumb(path){const im=h('img',{class:'thumb'});imgAsync(path).then(i=>{if(i)im.src=i.src});return im}
async function storeFile(f,p){const buf=await f.arrayBuffer();await idbPut(p,{buf,type:f.type||'image/png'});pending.add(p);deleted.delete(p);delete imgs[p];saveDraft();updateBadge()}
function canvasBlob(c){return new Promise(r=>c.toBlob(r,'image/png'))}
async function putCanvas(c,p){const b=await canvasBlob(c);await idbPut(p,{buf:await b.arrayBuffer(),type:'image/png'});pending.add(p);delete imgs[p]}
const allAssetPaths=()=>[...G.tilesets,...G.charsets,...G.faces,...G.parallaxes].map(a=>a.image);
/* 透明部分の表示（うす紫の市松模様） */
const TP=['#d6c8ec','#f1ebf9'],tpSrc={};
function tpPattern(c,cell){cell=Math.max(1,Math.round(cell));let s=tpSrc[cell];if(!s){s=document.createElement('canvas');s.width=s.height=cell*2;const q=s.getContext('2d');q.fillStyle=TP[0];q.fillRect(0,0,cell*2,cell*2);q.fillStyle=TP[1];q.fillRect(0,0,cell,cell);q.fillRect(cell,cell,cell,cell);tpSrc[cell]=s}return c.createPattern(s,'repeat')}
const parOf=m=>m&&m.parallax&&G.parallaxes.find(p=>p.id===m.parallax.id);
function uniquePath(dir,f){
  const ext=((f.name.match(/\.([a-z0-9]+)$/i)||[])[1]||'png').toLowerCase();
  let b=f.name.replace(/\.[^.]+$/,'').replace(/[^\w\-]+/g,'_').replace(/^_+|_+$/g,'');if(!b)b=uid();
  const used=new Set(allAssetPaths());let p=`assets/${dir}/${b}.${ext}`,n=2;
  while(used.has(p))p=`assets/${dir}/${b}_${n++}.${ext}`;return p;
}

/* ===== GitHub ===== */
function gitCfg(){return Object.assign({owner:'',repo:'',branch:'main',dir:'',token:''},lsGet('git',{}))}
function gitReady(){const g=gitCfg();return !!(g.owner&&g.repo&&g.token)}
function guessGit(){const g=gitCfg();if(g.owner)return;const m=location.hostname.match(/^([^.]+)\.github\.io$/i);if(!m)return;const seg=location.pathname.split('/').filter(Boolean);g.owner=m[1];g.repo=seg.length>1?seg[0]:m[1]+'.github.io';lsSet('git',g)}
function repoPath(p){const d=(gitCfg().dir||'').replace(/^\/+|\/+$/g,'');return d?d+'/'+p:p}
const encPath=p=>p.split('/').map(encodeURIComponent).join('/');
async function api(path,opt={}){
  const g=gitCfg();
  const r=await fetch(`https://api.github.com/repos/${g.owner}/${g.repo}${path}`,{method:opt.method||'GET',cache:'no-store',
    headers:Object.assign({Authorization:'Bearer '+g.token,Accept:opt.accept||'application/vnd.github+json'},opt.body?{'Content-Type':'application/json'}:{}),
    body:opt.body?JSON.stringify(opt.body):undefined});
  if(!r.ok){let m='';try{m=(await r.json()).message}catch(e){}const e=new Error(r.status+' '+m);e.status=r.status;throw e}
  return opt.raw?r:r.json();
}
function errMsg(e){const s=e.status;
  if(s===401)return'トークンが無効です';
  if(s===403)return'権限がありません（トークンの Contents 権限を確認）';
  if(s===404)return'リポジトリ/ブランチが見つかりません（名前・トークンの対象リポジトリを確認）';
  if(s===409)return'リポジトリが空です。GitHubで「Add a README」付きで作り直してください';
  if(s===422)return'競合しました。もう一度試してください';
  return e.message||String(e)}
function b64(buf){const u=new Uint8Array(buf);let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)}
async function headInfo(){
  const g=gitCfg();const ref=await api('/git/ref/heads/'+g.branch);
  const head=await api('/git/commits/'+ref.object.sha);
  const tr=await api('/git/trees/'+head.tree.sha+'?recursive=1');
  return{headSha:ref.object.sha,treeSha:head.tree.sha,files:new Map(tr.tree.filter(e=>e.type==='blob').map(e=>[e.path,e.sha]))};
}
async function pull(){
  const hi=await headInfo();const sha=hi.files.get(repoPath('data/game.json'));if(!sha)return false;
  const r=await api('/git/blobs/'+sha,{accept:'application/vnd.github.raw+json',raw:true});
  G=normalize(JSON.parse(await r.text()));base={h:hash(pretty(G)),sha};
  pending.clear();deleted.clear();await idbClear();for(const k in imgs)delete imgs[k];
  saveDraft();return true;
}
let gitBusy=false;
async function commitPush(msg){
  if(gitBusy)throw new Error('処理中です');gitBusy=true;
  try{
    const hi=await headInfo(),jp=repoPath('data/game.json'),remote=hi.files.get(jp)||null;
    if(remote&&remote!==base.sha&&!confirm('GitHub上の game.json が他の場所で更新されています。\nこの端末の内容で上書きしますか？\n（キャンセル → Gitタブの「読み込み」で最新を取得）'))return null;
    const text=pretty(G),items=[];let newSha=base.sha;
    if(hash(text)!==base.h||remote!==base.sha||!remote){
      const b=await api('/git/blobs',{method:'POST',body:{content:text,encoding:'utf-8'}});newSha=b.sha;
      if(b.sha!==remote)items.push({path:jp,mode:'100644',type:'blob',sha:b.sha});
    }
    for(const p of pending){const f=await idbGet(p);if(!f)continue;
      const b=await api('/git/blobs',{method:'POST',body:{content:b64(f.buf),encoding:'base64'}});
      if(hi.files.get(repoPath(p))!==b.sha)items.push({path:repoPath(p),mode:'100644',type:'blob',sha:b.sha})}
    for(const p of deleted)if(!pending.has(p)&&hi.files.has(repoPath(p)))items.push({path:repoPath(p),mode:'100644',type:'blob',sha:null});
    if(items.length){
      const t=await api('/git/trees',{method:'POST',body:{base_tree:hi.treeSha,tree:items}});
      const c=await api('/git/commits',{method:'POST',body:{message:msg,tree:t.sha,parents:[hi.headSha]}});
      await api('/git/refs/heads/'+gitCfg().branch,{method:'PATCH',body:{sha:c.sha,force:false}});
    }
    base={h:hash(text),sha:newSha};pending.clear();deleted.clear();saveDraft();return items.length;
  }finally{gitBusy=false;updateBadge()}
}
async function runPush(msg){
  if(!gitReady()){toast('Gitタブで接続設定をしてください');showTab('git');return}
  toast('プッシュ中…',60000);
  try{const n=await commitPush(msg||('更新 '+stamp()));toast(n===null?'中止しました':n?`プッシュ完了（${n}ファイル）`:'変更はありません')}
  catch(e){toast('失敗: '+errMsg(e),5000)}
  if(curTab==='git')renderGit();
}
async function runPull(){
  if(!gitReady()){toast('接続設定をしてください');return}
  if(changeCount()>0&&!confirm('未プッシュの変更は破棄されます。読み込みますか？'))return;
  toast('読み込み中…',60000);

}
function pushUndo(m){ME.undo.push({id:m.id,l:m.layers.map(a=>a.slice())});if(ME.undo.length>50)ME.undo.shift();ME.redo.length=0}

function startGest(){const pts=[...ptrs.values()];const mx=pts.reduce((a,p)=>a+p.x,0)/pts.length,my=pts.reduce((a,p)=>a+p.y,0)/pts.length;

function moveGest(){const pts=[...ptrs.values()];if(pts.length!==gest.n)return startGest();

  const d=pts.length>1?Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y):gest.d,z=clamp(gest.z*d/gest.d,.15,6);

function startStroke(t){
  const m=curMap();if(!m)return;ME.last=t;const tool=ME.tool;
  if(tool==='event'){stroke={tool,t0:t,t1:t,ev:evAt(m,t.x,t.y)};reqDraw();return}

  if(tool==='pick'){const cols=tsCols(m);let v=-1,l=ME.layer;for(let k=2;k>=0&&v<0;k--){const q=m.layers[k][t.y*m.w+t.x];if(q>=0&&(k===ME.layer||m.layers[ME.layer][t.y*m.w+t.x]<0)){v=q;l=k}}
    if(v>=0&&cols){ME.brush={x:v%cols,y:Math.floor(v/cols),w:1,h:1};ME.layer=l;ME.tool='pen';refreshTools();drawPalette()}return}

function endStroke(){

  if(s.tool==='rect'){const cols=tsCols(m),r=rectOf(s.t0,s.t1),L=m.layers[ME.layer];
    if(cols)for(let y=Math.max(0,r.y);y<Math.min(m.h,r.y+r.h);y++)for(let x=Math.max(0,r.x);x<Math.min(m.w,r.x+r.w);x++)L[y*m.w+x]=brushVal(cols,x-r.x,y-r.y)}

    if(s.ev){if(!same&&inMap(m,t)&&!evAt(m,t.x,t.y)){s.ev.x=t.x;s.ev.y=t.y;changed()}else if(same)openEvent(m,s.ev)}

function bindMap(){

    if(ptrs.size>2)return;
    if(ME.tool==='hand'){startGest();return}
    startStroke(toTile(mapPos(e)))});
  mapCv.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,mapPos(e));if(gest)moveGest();else if(stroke)moveStroke(toTile(mapPos(e)))});
  const up=e=>{if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);
    if(gest){if(ptrs.size===0)gest=null;else startGest()}
    else if(stroke){if(e.type==='pointercancel')cancelStroke();else endStroke()}};
  mapCv.addEventListener('pointerup',up);mapCv.addEventListener('pointercancel',up);
}

function condSummary(c){

  if(c.type==='var')return `${varName(c.id)} ${c.op} ${c.val}`;
  if(c.type==='item')return `${itemName(c.id)} を${c.has?'持っている':'持っていない'}`;
  if(c.type==='self')return `セルフ${c.key} が ${c.val?'ON':'OFF'}`;
  return '?';
}
function cmdSummary(c){
  switch(c.t){
    case'text':{const f=G.faces.find(x=>x.id===c.face);return(c.name?`【${c.name}】`:'')+(f?`(${f.name}) `:'')+(c.text||'')}
    case'choice':return c.options.map(o=>o.label).join(' / ');
    case'if':return condSummary(c.cond);
    case'sw':return `${swName(c.id)} = ${c.val?'ON':'OFF'}`;
    case'var':return `${varName(c.id)} ${{set:'=',add:'+=',sub:'-=',rand:'= 乱数0〜'}[c.op]} ${c.val}`;
    case'self':return `${c.key} = ${c.val?'ON':'OFF'}`;
    case'item':return `${itemName(c.id)} ${c.n>=0?'+':''}${c.n}`;
    case'move':return `${mapName(c.map)} (${c.x}, ${c.y})`;
    case'wait':return c.ms+'ms';
    case'comment':return c.text||'';
  }return '';
}

    bar2.innerHTML='';const f=st.float,s=st.sel,B=(l,k,cls)=>btn(l,()=>selAct(k),'sm '+(cls||''));
    const add=(...a)=>bar2.append(...a.filter(Boolean));
    if(f)add(h('span',{class:'hint',style:'margin:0 4px'},'貼り付け中：ドラッグで移動'),B('確定','ok','pri'),B('⇋反転','fliph'),B('⇅反転','flipv'),B('コピー','copy'),B('取消','drop','dg'));
    else if(s)add(h('span',{class:'hint',style:'margin:0 4px'},`${s.w}×${s.h}`),B('コピー','copy'),B('切り取り','cut'),st.clip?B('貼り付け','paste'):null,B('⇋反転','fliph'),B('⇅反転','flipv'),B('塗る','fill'),B('消す','del','dg'),B('解除','none'));
    else add(h('span',{class:'hint',style:'margin:0 4px'},st.tool==='select'?'ドラッグで範囲選択（選択内をドラッグで移動）':'1本指で描く／2本指で拡大・移動'),st.clip?B('貼り付け','paste'):null,st.tool==='select'?B('全選択','all'):null);
    bar2.style.display='flex';
  }
  const api=sheet((o.isNew?'新規：':'')+(o.asset?o.asset.name:o.name||'ドット絵'),(b)=>{
    b.style.cssText='display:flex;flex-direction:column;overflow:hidden;padding-bottom:env(safe-area-inset-bottom)';
    area=b;
    const wrap=h('div',{style:'flex:1;position:relative;min-height:120px;overflow:hidden'},cv=h('canvas',{style:'position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block'}));
    if(o.kind==='charsets'){pvCv=h('canvas',{width:144,height:144,style:'position:absolute;right:6px;top:6px;width:72px;height:72px;background:#fffd;border:1px solid var(--bd);border-radius:8px;image-rendering:pixelated',onclick:()=>{st.pdir=(st.pdir+1)%4}});wrap.append(pvCv)}
    colInp=h('input',{type:'color',style:'width:40px;height:34px;padding:0;border:0;background:none;flex:none',onchange:()=>{const hx=colInp.value;st.col=hex2c(hx);if(!PE_SW.includes(hx)&&!peRecent.includes(hx)){peRecent.unshift(hx);peRecent=peRecent.slice(0,6)}if(st.tool!=='pen'&&st.tool!=='fill'&&st.tool!=='line')st.tool='pen';refreshUI()}});
    swBox=h('div',{style:'display:flex;gap:6px'});
    bar2=h('div',{class:'bar',style:'border-top:1px solid var(--bd)'});
    b.append(wrap,bar2,
      h('div',{class:'bar'},...TOOLS.map(([k,l])=>h('button',{class:'btn','data-pt':k,onclick:()=>{if(k!=='select'&&k!=='hand')commitFloat();st.tool=k;refreshUI();req()}},l)),
        h('div',{class:'seg'},...[1,2,3,4].map(n=>h('button',{'data-ps':n,onclick:()=>{st.size=n;refreshUI()}},n))),
        btn('↶',undo),btn('↷',redo)),
      h('div',{class:'bar'},swBox,colInp,
        h('button',{class:'btn sm',id:'peGrid',onclick:()=>{st.grid=!st.grid;refreshUI();req()}},'#'),
        h('button',{class:'btn sm',id:'peSnap',onclick:()=>{st.snap=!st.snap;refreshUI()}},'🧲吸着'),
        btn('⤢',fit,'sm'),
        btn('⋯',()=>actionMenu([['🖼 画像を読み込んで貼り付け',importImg],['📐 キャンバスサイズ変更',resizeDlg],['🧹 全部消す',()=>{commitFloat();const b2=snap();A.fill(0);pushPatch(b2);req()},'danger']]),'sm')));
    bind();refreshUI();
    new ResizeObserver(()=>{if(!st.fitted&&cv.clientWidth){st.fitted=true;fit()}req()}).observe(wrap);
  },{back:'閉じる',actions:[['保存',()=>save()]],onClose:()=>{alive=false;clearInterval(pvTimer)}});
  const origClose=api.close;
  api.el.querySelector('.sh-head .btn').onclick=null;
  api.el.querySelector('.sh-head .btn').addEventListener('click',e=>{e.stopImmediatePropagation()},true);
  api.el.querySelector('.sh-head .btn').replaceWith(btn('閉じる',()=>{if(st.changed&&!confirm('保存していない変更があります。閉じますか？'))return;origClose()},'sm'));
  const pvTimer=setInterval(()=>{pvT++;drawPreview()},180);
}

/* ===== Gitタブ ===== */
function statusText(){const L=['game.json：'+(jsonDirty()?'変更あり':'変更なし')];
  if(pending.size)L.push('素材（追加・更新）：'+[...pending].map(p=>p.split('/').pop()).join(', '));
  if(deleted.size)L.push('素材（削除）：'+[...deleted].map(p=>p.split('/').pop()).join(', '));return L.join('\n')}
function renderGit(){
  const T=$('#tab-git');T.innerHTML='';const g=gitCfg(),save=()=>lsSet('git',g);
  const inp=(label,k,type='text',ph='')=>{const i=h('input',{type,value:g[k]||'',placeholder:ph,autocomplete:'off',autocapitalize:'off',spellcheck:'false',oninput:()=>{g[k]=i.value.trim();save()}});return field(label,i)};
  T.append(card('GitHub 接続',h('div',{class:'row'},inp('オーナー','owner'),inp('リポジトリ','repo')),h('div',{class:'row'},inp('ブランチ','branch','text','main'),inp('フォルダ（任意）','dir','text','空でOK')),
    inp('トークン','token','password','github_pat_...'),
    h('div',{class:'hint'},'Fine-grained token 推奨：Repository access でこのリポジトリだけを選び、Permissions → Contents を「Read and write」に。トークンはこの端末のブラウザにだけ保存されます（同じ github.io の他ページからも読めるので、対象を絞ったトークンにしてください）。'),
    btn('接続テスト',async()=>{try{const r=await api('');toast('接続OK: '+r.full_name)}catch(e){toast(errMsg(e),4500)}},'sm')));
  const msg=h('input',{type:'text',placeholder:'空なら「更新 日時」'});
  T.append(card('コミット＆プッシュ',h('div',{style:'white-space:pre-wrap;font-size:14px;margin-bottom:6px'},statusText()),field('コミットメッセージ',msg),btn('コミット＆プッシュ',()=>runPush(msg.value.trim()),'pri'),
    h('div',{class:'hint'},'画面上部の ☁ ボタンでも、メッセージ省略でワンタップでプッシュできます。GitHub Pages への反映は1分ほどかかります。')));
  T.append(card('読み込み・テスト',btn('GitHubから読み込み',runPull),' ',btn('テストプレイ',()=>testPlay()),
    h('div',{class:'hint'},'テストプレイは未プッシュの内容（素材含む）でそのまま遊べます。')));
  T.append(card('バックアップ',btn('JSON書き出し',exportJson,'sm'),' ',btn('JSON読み込み',importJson,'sm'),' ',
    btn('新規プロジェクト',async()=>{if(!confirm('今の内容を破棄して、サンプル入りの新規プロジェクトにしますか？'))return;await newProject();afterLoad();toast('新規プロジェクトを作成しました')},'sm dg')));
}
function exportJson(){const a=h('a',{href:URL.createObjectURL(new Blob([pretty(G)],{type:'application/json'})),download:'game.json'});document.body.append(a);a.click();a.remove()}
function importJson(){const i=h('input',{type:'file',accept:'.json,application/json',style:'display:none'});i.onchange=async()=>{const f=i.files[0];i.remove();if(!f)return;
  try{G=normalize(JSON.parse(await f.text()));changed();saveDraft();afterLoad();toast('読み込みました')}catch(e){toast('JSONが読めません')}};document.body.append(i);i.click()}

/* ===== 全体 ===== */
function updateTitle(){const t=$('#ttl');if(t)t.textContent=(G.title||'無題')+' ・ エディタ'}
function showTab(k){
  curTab=k;for(const t of['map','db','assets','git']){$('#tab-'+t).classList.toggle('on',t===k);$('#nv-'+t).classList.toggle('on',t===k)}
  if(k==='map'){refreshMapSel();reqDraw();drawPalette()}
  if(k==='db')renderDB();if(k==='assets')renderAssets();if(k==='git')renderGit();
}
function buildUI(){
  document.body.innerHTML='';
  document.body.append(
    h('header',null,h('div',{class:'ttl',id:'ttl'}),
      h('button',{class:'btn',onclick:()=>window.open('help.html','_blank')},'？'),
      h('button',{class:'btn',onclick:()=>actionMenu([['▶ 開始位置からテストプレイ',()=>testPlay()],['▶ 表示中マップの中央から',()=>{const m=curMap();testPlay(m.id,Math.floor(m.w/2),Math.floor(m.h/2))}]])},'▶'),
      h('button',{class:'btn badge',id:'badge',onclick:()=>runPush()},'☁')),
    h('main',null,...['map','db','assets','git'].map(k=>h('div',{class:'tab',id:'tab-'+k}))),
    h('nav',null,...[['map','🗺 マップ'],['db','📚 データ'],['assets','🖼 素材'],['git','☁ Git']].map(([k,l])=>h('button',{id:'nv-'+k,onclick:()=>showTab(k)},l))));
  buildMapTab();updateTitle();updateBadge();
}
function afterLoad(){ME.mapId=G.maps[0].id;ME.undo=[];ME.redo=[];ME.needFit=true;buildUI();showTab(curTab||'map')}
(async()=>{
  guessGit();
  G=lsGet('draft',null);base=lsGet('base',{h:null,sha:null});pending=new Set(lsGet('pending',[]));deleted=new Set(lsGet('deleted',[]));
  if(G)G=normalize(G);
  if(!G&&gitReady()){try{await pull()}catch(e){toast('GitHubから読み込めませんでした: '+errMsg(e),4500)}}
  if(!G)await loadFromSite();
  if(!G)await newProject();
  ME.mapId=G.maps[0].id;buildUI();showTab('map');
})();
</script>
