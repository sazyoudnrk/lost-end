<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>RPG</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:#fff;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:system-ui,-apple-system,"Hiragino Sans",sans-serif}
#cv{position:fixed;left:0;top:0;width:100vw;height:100vh;height:100dvh;image-rendering:pixelated;display:block}
#tap{position:fixed;inset:0;z-index:5;display:none}
#msg{position:fixed;left:8px;right:8px;bottom:calc(14px + env(safe-area-inset-bottom));min-height:118px;background:rgba(12,14,34,.9);border:2px solid #fff;border-radius:10px;padding:16px 12px 14px;display:none;gap:10px;z-index:6;pointer-events:none}
#msg.show{display:flex}
#face{width:96px;height:96px;flex:none;object-fit:contain;display:none;image-rendering:pixelated}
#mname{position:absolute;top:-15px;left:12px;background:rgba(12,14,34,.96);border:2px solid #fff;border-radius:6px;padding:1px 10px;font-size:14px;display:none}
#mtext{flex:1;font-size:17px;line-height:1.65;white-space:pre-wrap;word-break:break-all}
#arrow{position:absolute;right:12px;bottom:4px;display:none;animation:bl 1s infinite}
@keyframes bl{50%{opacity:0}}
.shake{animation:shk .35s}
@keyframes shk{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
#choices{position:fixed;right:10px;bottom:calc(146px + env(safe-area-inset-bottom));display:none;flex-direction:column;gap:6px;z-index:7;max-width:80vw}
.ui-btn{background:rgba(12,14,34,.92);color:#fff;border:2px solid #fff;border-radius:8px;padding:10px 18px;font:inherit;font-size:16px;text-align:left;touch-action:manipulation}
#pad{position:fixed;left:14px;bottom:calc(18px + env(safe-area-inset-bottom));width:150px;height:150px;z-index:4;touch-action:none}
#pad b{position:absolute;width:50px;height:50px;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.35);border-radius:10px;pointer-events:none}
#pad b.on{background:rgba(255,255,255,.45)}
#abtn{position:fixed;right:22px;bottom:calc(40px + env(safe-area-inset-bottom));width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.4);z-index:4;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:22px;touch-action:none}
#abtn.on{background:rgba(255,255,255,.45)}
#menuBtn{position:fixed;right:10px;top:calc(10px + env(safe-area-inset-top));z-index:4;padding:6px 14px}
#menu,#title{position:fixed;inset:0;z-index:10;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(0,0,0,.75)}
#title{background:#000}
#title h1{font-size:28px;margin:0 20px 30px;text-align:center}
#menu .ui-btn,#title .ui-btn{min-width:200px;text-align:center}
#items{max-height:50vh;overflow:auto;min-width:240px;background:rgba(12,14,34,.92);border:2px solid #fff;border-radius:8px;padding:8px 12px;display:none;line-height:1.8}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.hide{display:none!important}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="tap"></div>
<div id="msg"><div id="mname"></div><img id="face" alt=""><div id="mtext"></div><div id="arrow">▼</div></div>
<div id="choices"></div>
<div id="pad"><b data-d="3" style="left:50px;top:0"></b><b data-d="1" style="left:0;top:50px"></b><b data-d="2" style="left:100px;top:50px"></b><b data-d="0" style="left:50px;top:100px"></b></div>
<div id="abtn">A</div>
<button id="menuBtn" class="ui-btn">☰</button>
<div id="menu"><div id="items"></div><button class="ui-btn" data-m="items">アイテム</button><button class="ui-btn" data-m="save">セーブ</button><button class="ui-btn" data-m="load">ロード</button><button class="ui-btn" data-m="close">閉じる</button></div>
<div id="title"><h1 id="ttl"></h1><button class="ui-btn" id="tNew">はじめから</button><button class="ui-btn" id="tCont">つづきから</button></div>
<div id="fade"></div>
<script>
'use strict';
const NS='rpgmk:'+location.pathname.replace(/[^/]*$/,'');
const Q=new URLSearchParams(location.search);
const PREVIEW=Q.has('preview');
const SAVEKEY=NS+(PREVIEW?'save_preview':'save');
const DIRS=[[0,1],[-1,0],[1,0],[0,-1]]; // 下 左 右 上（歩行グラの行順）
const $=s=>document.querySelector(s);
const cv=$('#cv'), ctx=cv.getContext('2d');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const END={};
let G=null,S=null,map=null,tsImg=null,parImg=null,blocked=new Set(),events=[],scale=2,busy=false,menuOpen=false;
const P={x:0,y:0,px:0,py:0,tx:0,ty:0,dir:0,moving:false,anim:0};

/* ---------- ファイル ---------- */
let _db=null;
function db(){return _db||(_db=new Promise((res,rej)=>{const r=indexedDB.open(NS,1);r.onupgradeneeded=()=>r.result.createObjectStore('files');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))}
async function idbGet(k){try{const d=await db();return await new Promise(res=>{const q=d.transaction('files').objectStore('files').get(k);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)})}catch(e){return null}}
const imgP={},imgR={};
function loadImg(path){
  if(!path)return Promise.resolve(null);
  if(imgP[path])return imgP[path];
  return imgP[path]=(async()=>{
    let src=path;
    if(PREVIEW){const f=await idbGet(path);src=f?URL.createObjectURL(new Blob([f.buf],{type:f.type||'image/png'})):path+'?t='+Date.now()}
    const im=await new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src});
    imgR[path]=im;return im;
  })();
}
const charsetOf=id=>G.charsets.find(c=>c.id===id);
function charImg(id){const c=charsetOf(id);if(!c)return null;if(!imgP[c.image])loadImg(c.image);return imgR[c.image]||null}

async function loadData(){
  if(PREVIEW){const s=localStorage.getItem(NS+'draft');if(s)return JSON.parse(s)}
  const r=await fetch('data/game.json?t='+Date.now());
  if(!r.ok)throw new Error(r.status);
  return r.json();
}
function normalize(g){
  g.tileSize=g.tileSize||32;
  for(const k of['tilesets','charsets','faces','parallaxes','items','maps','switches','variables'])g[k]=g[k]||[];
  g.player=g.player||{map:g.maps[0]&&g.maps[0].id,x:0,y:0,dir:0};
  for(const m of g.maps){m.events=m.events||[];for(const e of m.events){e.pages=e.pages||[];for(const p of e.pages){p.cond=p.cond||[];p.cmds=p.cmds||[]}}}
}

/* ---------- 入力 ---------- */
const held=[];let aPressed=false,needRelease=false;
function press(d){if(!held.includes(d))held.push(d)}
function release(d){const i=held.indexOf(d);if(i>=0)held.splice(i,1)}
function curDir(){if(needRelease){if(!held.length)needRelease=false;return null}return held.length?held[held.length-1]:null}
const KEY={ArrowDown:0,ArrowLeft:1,ArrowRight:2,ArrowUp:3,s:0,a:1,d:2,w:3};
addEventListener('keydown',e=>{
  if(e.key in KEY){press(KEY[e.key]);e.preventDefault()}
  else if(['Enter',' ','z','Z'].includes(e.key)){e.preventDefault();if(e.repeat)return;if(busy)advance();else aPressed=true}
  else if(e.key==='Escape'||e.key==='x'){if(!busy)toggleMenu()}
});
addEventListener('keyup',e=>{if(e.key in KEY)release(KEY[e.key])});
const pad=$('#pad');let padD=null;
function padAt(e){const r=pad.getBoundingClientRect();const x=e.clientX-r.left-75,y=e.clientY-r.top-75;if(Math.hypot(x,y)<12)return padD;return Math.abs(x)>Math.abs(y)?(x<0?1:2):(y<0?3:0)}
function setPad(d){if(padD===d)return;if(padD!=null)release(padD);padD=d;if(d!=null)press(d);pad.querySelectorAll('b').forEach(b=>b.classList.toggle('on',+b.dataset.d===d))}
pad.addEventListener('pointerdown',e=>{e.preventDefault();pad.setPointerCapture(e.pointerId);setPad(padAt(e))});
pad.addEventListener('pointermove',e=>{if(pad.hasPointerCapture(e.pointerId))setPad(padAt(e))});
pad.addEventListener('pointerup',()=>setPad(null));pad.addEventListener('pointercancel',()=>setPad(null));
const abtn=$('#abtn');
abtn.addEventListener('pointerdown',e=>{e.preventDefault();abtn.classList.add('on');if(busy)advance();else aPressed=true});
abtn.addEventListener('pointerup',()=>abtn.classList.remove('on'));abtn.addEventListener('pointercancel',()=>abtn.classList.remove('on'));
const tapEl=$('#tap');
tapEl.addEventListener('pointerdown',e=>{e.preventDefault();advance()});
function showControls(v){for(const el of[pad,abtn,$('#menuBtn')])el.classList.toggle('hide',!v)}

/* ---------- マップ ---------- */
async function loadMap(id,x,y,dir){
  const m=G.maps.find(m=>m.id===+id);
  if(!m){alert('マップ '+id+' がありません');return}
  map=m;
  const t=G.tilesets.find(t=>t.id===m.tileset)||G.tilesets[0]||null;
  blocked=new Set(t?t.blocked||[]:[]);
  tsImg=t?await loadImg(t.image):null;
  const pr=m.parallax&&G.parallaxes.find(p=>p.id===m.parallax.id);parImg=pr?await loadImg(pr.image):null;
  events=m.events.map(d=>({d,x:d.x,y:d.y,dir:0,page:undefined,erased:false}));
  const ts=G.tileSize;
  P.x=P.tx=x;P.y=P.ty=y;P.px=x*ts;P.py=y*ts;P.moving=false;
  if(dir!=null&&dir>=0)P.dir=dir;
  S.map=m.id;
  refresh();
  charImg(G.player.charset);
}
function evalCond(c,cx){
  switch(c.type){
    case'sw':return !!S.sw[c.id]===!!c.val;
    case'var':{const a=S.vr[c.id]||0,b=+c.val||0;return c.op==='=='?a===b:c.op==='!='?a!==b:c.op==='>='?a>=b:c.op==='<='?a<=b:c.op==='>'?a>b:a<b}
    case'item':return((S.it[c.id]||0)>0)===!!c.has;
    case'self':return !!S.ss[cx.mapId+':'+cx.ev.d.id+':'+c.key]===!!c.val;
  }
  return true;
}
function refresh(){
  if(!map)return;
  for(const e of events){
    const ps=e.d.pages;let pg=null;
    for(let i=ps.length-1;i>=0;i--){if(ps[i].cond.every(c=>evalCond(c,{mapId:map.id,ev:e}))){pg=ps[i];break}}
    if(pg!==e.page){e.page=pg;if(pg&&pg.image){e.dir=pg.image.dir||0;if(pg.image.charset)charImg(pg.image.charset)}}
  }
}
function evAt(x,y,f){return events.find(e=>!e.erased&&e.page&&e.x===x&&e.y===y&&f(e))}
function passable(x,y){
  if(x<0||y<0||x>=map.w||y>=map.h)return false;
  const i=y*map.w+x;
  for(const l of[0,1]){const v=map.layers[l]&&map.layers[l][i];if(v>=0&&blocked.has(v))return false}
  if(evAt(x,y,e=>e.page.priority!=='below'&&!e.page.through))return false;
  return true;
}
function onArrive(){const e=evAt(P.x,P.y,e=>e.page.priority==='below'&&e.page.trigger==='touch');if(e)runEvent(e)}
function checkAction(){
  let e=evAt(P.x,P.y,e=>e.page.priority==='below'&&e.page.trigger!=='auto');
  if(!e){const nx=P.x+DIRS[P.dir][0],ny=P.y+DIRS[P.dir][1];e=evAt(nx,ny,e=>e.page.priority!=='below'&&e.page.trigger!=='auto');if(e&&e.page.image&&e.page.image.charset)e.dir=3-P.dir}
  if(e){runEvent(e);return true}return false;
}
function checkBump(x,y){const e=evAt(x,y,e=>e.page.priority!=='below'&&e.page.trigger==='touch');if(e){runEvent(e);return true}return false}
function checkAuto(){const e=events.find(e=>!e.erased&&e.page&&e.page.trigger==='auto');if(e)runEvent(e)}

/* ---------- イベント実行 ---------- */
async function runEvent(ev){
  busy=true;aPressed=false;setPad(null);held.length=0;showControls(false);tapEl.style.display='block';
  const cx={ev,mapId:map.id};
  try{await exec(ev.page.cmds,cx)}catch(e){if(e!==END)console.error(e)}
  hideMsg();busy=false;tapEl.style.display='none';showControls(true);needRelease=true;refresh();
}
async function exec(list,cx){for(const c of list||[])await cmd(c,cx)}
async function cmd(c,cx){
  switch(c.t){
    case'text':await showText(c);break;
    case'choice':{const i=await showChoice(c.options.map(o=>o.label));await exec(c.options[i].cmds,cx);break}
    case'if':await exec(evalCond(c.cond,cx)?c.then:(c.hasElse?c.else:[]),cx);break;
    case'sw':S.sw[c.id]=!!c.val;refresh();break;
    case'var':{let v=S.vr[c.id]||0;const n=+c.val||0;v=c.op==='set'?n:c.op==='add'?v+n:c.op==='sub'?v-n:c.op==='rand'?Math.floor(Math.random()*(n+1)):v;S.vr[c.id]=v;refresh();break}
    case'self':S.ss[cx.mapId+':'+cx.ev.d.id+':'+c.key]=!!c.val;refresh();break;
    case'item':S.it[c.id]=Math.max(0,(S.it[c.id]||0)+(+c.n||0));refresh();break;
    case'move':hideMsg();await fade(1);await loadMap(c.map,c.x,c.y,c.dir);await fade(0);break;
    case'wait':await sleep(+c.ms||0);break;
    case'erase':cx.ev.erased=true;break;
    case'end':throw END;
  }
}
const msgEl=$('#msg'),faceEl=$('#face'),nameEl=$('#mname'),textEl=$('#mtext'),arrowEl=$('#arrow'),chEl=$('#choices');
let onAdvance=null;
function advance(){if(onAdvance)onAdvance()}
function tokenize(s){
  const out=[],re=/\[w=(\d+)\]|\[shake\]|\[v=(\d+)\]/g;let i=0,m;
  const push=str=>{for(const ch of str)out.push({s:ch})};
  while((m=re.exec(s))){push(s.slice(i,m.index));if(m[1]!=null)out.push({w:+m[1]});else if(m[2]!=null)push(String(S.vr[+m[2]-1]||0));else out.push({shake:1});i=re.lastIndex}
  push(s.slice(i));return out;
}
function waitMs(ms,skip){return new Promise(r=>{const t0=performance.now();(function f(){if(skip()||performance.now()-t0>=ms)r();else requestAnimationFrame(f)})()})}
async function showText(c){
  msgEl.classList.add('show');
  const f=G.faces.find(x=>x.id===c.face);
  const fim=f?await loadImg(f.image):null;
  if(fim){faceEl.src=fim.src;faceEl.style.display='block'}else faceEl.style.display='none';
  nameEl.textContent=c.name||'';nameEl.style.display=c.name?'block':'none';
  textEl.textContent='';arrowEl.style.display='none';
  let skip=false,typing=true;
  const done=new Promise(r=>{onAdvance=()=>{if(typing)skip=true;else{onAdvance=null;r()}}});
  for(const tk of tokenize(c.text||'')){
    if(tk.w!=null){if(!skip)await waitMs(tk.w,()=>skip)}
    else if(tk.shake){if(!skip){msgEl.classList.remove('shake');void msgEl.offsetWidth;msgEl.classList.add('shake')}}
    else{textEl.textContent+=tk.s;if(!skip)await waitMs(28,()=>skip)}
  }
  typing=false;arrowEl.style.display='block';
  await done;arrowEl.style.display='none';
}
function showChoice(labels){
  return new Promise(r=>{
    onAdvance=null;chEl.innerHTML='';
    labels.forEach((l,i)=>{const b=document.createElement('button');b.className='ui-btn';b.textContent=l;
      b.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();chEl.style.display='none';r(i)});chEl.append(b)});
    chEl.style.display='flex';
  });
}
function hideMsg(){msgEl.classList.remove('show');chEl.style.display='none';onAdvance=null}
function fade(v){$('#fade').style.opacity=v;return sleep(270)}

/* ---------- 更新・描画 ---------- */
function update(){
  if(!map||!S)return;
  const ts=G.tileSize,sp=Math.max(1,ts/8);
  if(P.moving){
    const gx=P.tx*ts,gy=P.ty*ts;
    P.px+=Math.sign(gx-P.px)*Math.min(sp,Math.abs(gx-P.px));
    P.py+=Math.sign(gy-P.py)*Math.min(sp,Math.abs(gy-P.py));
    P.anim++;
    if(P.px===gx&&P.py===gy){P.moving=false;P.x=P.tx;P.y=P.ty;if(!busy)onArrive()}
  }
  if(P.moving||busy||menuOpen)return;
  if(aPressed){aPressed=false;if(checkAction())return}
  const d=curDir();
  if(d!=null){
    P.dir=d;const nx=P.x+DIRS[d][0],ny=P.y+DIRS[d][1];
    if(passable(nx,ny)){P.tx=nx;P.ty=ny;P.moving=true;if(!P.anim)P.anim=1}
    else{P.anim=0;if(checkBump(nx,ny))return}
  }else P.anim=0;
  if(!busy)checkAuto();
}
function resize(){cv.width=Math.round(cv.clientWidth*(devicePixelRatio||1));cv.height=Math.round(cv.clientHeight*(devicePixelRatio||1));const ts=G?G.tileSize:32;scale=Math.max(1,Math.round(Math.min(cv.width,cv.height)/(ts*11)))}
addEventListener('resize',resize);
function tileDraw(v,x,y){const ts=G.tileSize,cols=Math.floor(tsImg.width/ts);if(!cols)return;ctx.drawImage(tsImg,(v%cols)*ts,Math.floor(v/cols)*ts,ts,ts,x,y,ts,ts)}
function layer(l,x0,y0,x1,y1){const L=map.layers[l];if(!L||!tsImg)return;const ts=G.tileSize;for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){const v=L[y*map.w+x];if(v>=0)tileDraw(v,x*ts,y*ts)}}
// 歩行グラ：縦長=1キャラ(3x4コマ)、横長=8キャラ並び(12x8コマ)。index で何人目かを指定
function charRect(im,index,dir,frame){const m=im.width>im.height,fw=im.width/(m?12:3),fh=im.height/(m?8:4),i=m?(index||0):0;return[((i%4)*3+frame)*fw,(Math.floor(i/4)*4+dir)*fh,fw,fh]}
function drawChar(cs,im,dir,frame,px,py){const ts=G.tileSize,[sx,sy,fw,fh]=charRect(im,cs.index,dir,frame);ctx.drawImage(im,sx,sy,fw,fh,Math.round(px+ts/2-fw/2),Math.round(py+ts-fh),fw,fh)}
function drawEv(e){const im=e.page.image,ts=G.tileSize;if(im.tile!=null){if(tsImg)tileDraw(im.tile,e.x*ts,e.y*ts)}else{const ci=charImg(im.charset);if(ci)drawChar(charsetOf(im.charset),ci,e.dir,1,e.x*ts,e.y*ts)}}
function drawPlayer(){const ci=charImg(G.player.charset);if(!ci)return;const f=P.anim?[1,2,1,0][Math.floor(P.anim/8)%4]:1;drawChar(charsetOf(G.player.charset),ci,P.dir,f,P.px,P.py)}
function draw(){
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#000';ctx.fillRect(0,0,cv.width,cv.height);
  if(!map)return;
  const ts=G.tileSize,vw=cv.width/scale,vh=cv.height/scale,mw=map.w*ts,mh=map.h*ts;
  let cx=mw>vw?Math.min(Math.max(P.px+ts/2-vw/2,0),mw-vw):(mw-vw)/2;
  let cy=mh>vh?Math.min(Math.max(P.py+ts/2-vh/2,0),mh-vh):(mh-vh)/2;
  cx=Math.round(cx*scale)/scale;cy=Math.round(cy*scale)/scale;
  ctx.setTransform(scale,0,0,scale,-cx*scale,-cy*scale);ctx.imageSmoothingEnabled=false;
  const x0=Math.max(0,Math.floor(cx/ts)),y0=Math.max(0,Math.floor(cy/ts)),x1=Math.min(map.w,Math.ceil((cx+vw)/ts)+1),y1=Math.min(map.h,Math.ceil((cy+vh)/ts)+1);
  if(parImg&&parImg.width){const pp=map.parallax,r=(pp.rate??20)/100,iw=parImg.width,ih=parImg.height,t=performance.now()/1000;
    const ox=cx*(1-r)+(pp.sx||0)*t,oy=cy*(1-r)+(pp.sy||0)*t,sx0=ox+Math.floor((cx-ox)/iw)*iw,sy0=oy+Math.floor((cy-oy)/ih)*ih;
    for(let y=sy0;y<cy+vh;y+=ih)for(let x=sx0;x<cx+vw;x+=iw)ctx.drawImage(parImg,Math.round(x*scale)/scale,Math.round(y*scale)/scale)}
  layer(0,x0,y0,x1,y1);layer(1,x0,y0,x1,y1);layer(2,x0,y0,x1,y1);
  const list=[];
  for(const e of events){if(e.erased||!e.page||!e.page.image)continue;list.push({z:e.page.priority==='below'?0:1,y:e.y*ts,f:()=>drawEv(e)})}
  list.push({z:1,y:P.py,f:drawPlayer});
  list.sort((a,b)=>a.z-b.z||a.y-b.y);for(const o of list)o.f();
  layer(3,x0,y0,x1,y1);
}
function loop(){update();draw();requestAnimationFrame(loop)}

/* ---------- メニュー・タイトル ---------- */
function toggleMenu(v){menuOpen=v==null?!menuOpen:v;$('#menu').style.display=menuOpen?'flex':'none';$('#items').style.display='none'}
$('#menuBtn').addEventListener('click',()=>toggleMenu(true));
$('#menu').addEventListener('click',e=>{
  const m=e.target.dataset&&e.target.dataset.m;if(!m)return;
  if(m==='close')toggleMenu(false);
  if(m==='items'){const it=$('#items');const own=G.items.filter(i=>(S.it[i.id]||0)>0);it.innerHTML='';
    if(!own.length)it.textContent='なにも持っていない';
    for(const i of own){const d=document.createElement('div');d.textContent=`${i.name} ×${S.it[i.id]}`+(i.desc?`　${i.desc}`:'');it.append(d)}
    it.style.display='block'}
  if(m==='save'){S.x=P.x;S.y=P.y;S.dir=P.dir;localStorage.setItem(SAVEKEY,JSON.stringify(S));e.target.textContent='セーブしました';setTimeout(()=>e.target.textContent='セーブ',1200)}
  if(m==='load')loadGame();
});
async function loadGame(){const s=localStorage.getItem(SAVEKEY);if(!s){alert('セーブデータがありません');return}S=JSON.parse(s);toggleMenu(false);$('#title').style.display='none';await fade(1);await loadMap(S.map,S.x,S.y,S.dir);await fade(0)}
async function startNew(){
  const p=G.player;S={map:p.map,x:p.x,y:p.y,dir:p.dir||0,sw:{},vr:{},it:{},ss:{}};
  if(PREVIEW&&Q.has('map')){S.map=+Q.get('map');S.x=+Q.get('x')||0;S.y=+Q.get('y')||0}
  await loadMap(S.map,S.x,S.y,S.dir);
}
function showTitle(){
  $('#ttl').textContent=G.title||'';$('#title').style.display='flex';
  $('#tCont').classList.toggle('hide',!localStorage.getItem(SAVEKEY));
  $('#tNew').onclick=async()=>{$('#title').style.display='none';await startNew()};
  $('#tCont').onclick=loadGame;
}
(async()=>{
  try{G=await loadData()}catch(e){document.body.innerHTML='<p style="padding:20px;color:#fff">data/game.json を読み込めませんでした。</p>';return}
  normalize(G);document.title=G.title||'RPG';resize();
  for(const c of G.charsets)loadImg(c.image);
  loop();
  if(PREVIEW)startNew();else showTitle();
})();
</script>
</body>
</html>
