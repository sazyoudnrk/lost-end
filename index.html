<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>RPG</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:#fff;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:system-ui,-apple-system,"Hiragino Sans",sans-serif}
#cv{position:absolute;left:0;top:0;width:100%;height:100%;image-rendering:pixelated;display:block}
#tap{position:absolute;inset:0;z-index:5;display:none}
#pics{position:absolute;inset:0;z-index:3;pointer-events:none;overflow:hidden}
#pics img{position:absolute;bottom:0;height:78%;max-width:70%;object-fit:contain;object-position:bottom;opacity:0;transition:opacity .25s,filter .25s;image-rendering:auto}
#pics img.show{opacity:1}
#pics img.dim{filter:brightness(.55)}
#picL{left:-4%}#picC{left:50%;transform:translateX(-50%)}#picR{right:-4%}
#still{position:absolute;inset:0;z-index:4;background:#000;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .4s}
#still.show{opacity:1}
#still img{width:100%;height:100%;object-fit:contain}
#msg{position:absolute;left:8px;right:8px;bottom:calc(14px + env(safe-area-inset-bottom));min-height:118px;background:rgba(12,14,34,.9);border:2px solid #fff;border-radius:10px;padding:16px 12px 14px;display:none;gap:10px;z-index:6;pointer-events:none}
#msg.show{display:flex}
#face{width:96px;height:96px;flex:none;object-fit:contain;display:none;image-rendering:pixelated}
#mname{position:absolute;top:-15px;left:12px;background:rgba(12,14,34,.96);border:2px solid #fff;border-radius:6px;padding:1px 10px;font-size:14px;display:none}
#mtext{flex:1;font-size:17px;line-height:1.65;white-space:pre-wrap;word-break:break-all}
#arrow{position:absolute;right:12px;bottom:4px;display:none;animation:bl 1s infinite}
@keyframes bl{50%{opacity:0}}
.shake{animation:shk .35s}
@keyframes shk{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
#choices{position:absolute;right:10px;bottom:calc(146px + env(safe-area-inset-bottom));display:none;flex-direction:column;gap:6px;z-index:7;max-width:80%}
.ui-btn{background:rgba(12,14,34,.92);color:#fff;border:2px solid #fff;border-radius:8px;padding:10px 18px;font:inherit;font-size:16px;text-align:left;touch-action:manipulation}
#pad{position:absolute;left:14px;bottom:calc(18px + env(safe-area-inset-bottom));width:150px;height:150px;z-index:4;touch-action:none}
#pad b{position:absolute;width:50px;height:50px;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.35);border-radius:10px;pointer-events:none}
#pad b.on{background:rgba(255,255,255,.45)}
#abtn{position:absolute;right:22px;bottom:calc(40px + env(safe-area-inset-bottom));width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.4);z-index:4;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:22px;touch-action:none}
#abtn.on{background:rgba(255,255,255,.45)}
#menuBtn{position:absolute;right:10px;top:calc(10px + env(safe-area-inset-top));z-index:4;padding:6px 14px}
#menu,#title{position:absolute;inset:0;z-index:10;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(0,0,0,.75)}
#title{background:#000}
#title h1{font-size:28px;margin:0 20px 30px;text-align:center}
#menu .ui-btn,#title .ui-btn{min-width:200px;text-align:center}
#items{max-height:50%;overflow:auto;min-width:240px;background:rgba(12,14,34,.92);border:2px solid #fff;border-radius:8px;padding:8px 12px;display:none;line-height:1.8}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.hide{display:none!important}
#hud{position:absolute;left:10px;top:calc(10px + env(safe-area-inset-top));z-index:4;background:rgba(12,14,34,.85);border:2px solid #fff;border-radius:8px;padding:4px 12px;font-size:14px;pointer-events:none;white-space:nowrap}
#daycard{position:absolute;inset:0;z-index:21;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;opacity:0;pointer-events:none;transition:opacity .5s}
#daycard.show{opacity:1}#daycard b{font-size:34px;letter-spacing:.2em}#daycard span{font-size:16px;color:#aaa}
#shop{position:absolute;inset:0;z-index:12;background:rgba(0,0,0,.85);display:none;flex-direction:column;padding:calc(14px + env(safe-area-inset-top)) 12px calc(14px + env(safe-area-inset-bottom))}
#shop.show{display:flex}
#shop h2{margin:0 0 4px;font-size:20px;text-align:center;letter-spacing:.1em}
#shop .st{display:flex;justify-content:space-between;font-size:14px;color:#ccc;margin:4px 2px 8px}
#shop .tabs{display:flex;gap:6px;margin-bottom:8px}#shop .tabs .ui-btn{flex:1;text-align:center;padding:8px}#shop .tabs .ui-btn.on{background:#fff;color:#000}
#shop .list{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px}
#shop .card{border:2px solid #fff;border-radius:10px;padding:10px 12px;background:rgba(12,14,34,.92);display:flex;gap:10px;align-items:center}
#shop .card.sold{opacity:.35}#shop .card div{flex:1}#shop .card b{display:block;font-size:16px}#shop .card small{color:#bbb;font-size:13px;line-height:1.4;display:block}
#shop .card .ui-btn{padding:8px 12px;white-space:nowrap;text-align:center}
#shop .msg{min-height:22px;text-align:center;font-size:14px;margin:6px 0}

#screen{position:fixed;left:0;top:0;overflow:hidden;background:#000;transform-origin:0 0}
.ui-btn.kf{background:#fff;color:#000}
.ui-btn:disabled{opacity:.5}
body.notouch #pad,body.notouch #abtn{display:none}
</style>
</head>
<body>
<div id="screen">
<canvas id="cv"></canvas>
<div id="pics"><img id="picL" alt=""><img id="picC" alt=""><img id="picR" alt=""></div>
<div id="still"><img alt=""></div>
<div id="tap"></div>
<div id="msg"><div id="mname"></div><img id="face" alt=""><div id="mtext"></div><div id="arrow">▼</div></div>
<div id="choices"></div>
<div id="pad"><b data-d="3" style="left:50px;top:0"></b><b data-d="1" style="left:0;top:50px"></b><b data-d="2" style="left:100px;top:50px"></b><b data-d="0" style="left:50px;top:100px"></b></div>
<div id="abtn">A</div>
<button id="menuBtn" class="ui-btn">☰</button>
<div id="menu"><div id="items"></div><button class="ui-btn" data-m="items">アイテム</button><button class="ui-btn" data-m="save">セーブ</button><button class="ui-btn" data-m="load">ロード</button><button class="ui-btn" data-m="close">閉じる</button></div>
<div id="title"><h1 id="ttl"></h1><button class="ui-btn" id="tNew">はじめから</button><button class="ui-btn" id="tCont">つづきから</button></div>
<div id="hud"></div>
<div id="shop"><h2>等価交換機</h2><div class="st"><span id="shopMoney"></span><span id="shopLimit"></span></div><div class="tabs"><button class="ui-btn on" data-tab="buy">取り出す</button><button class="ui-btn" data-tab="sell">入れる</button></div><div class="list"></div><div class="msg"></div><button class="ui-btn" id="shopClose" style="text-align:center">閉じる</button></div>
<div id="daycard"><b></b><span></span></div>
<div id="fade"></div>
</div>
<script>
'use strict';
const NS='rpgmk:'+location.pathname.replace(/[^/]*$/,'');
const Q=new URLSearchParams(location.search);
const PREVIEW=Q.has('preview');
const SAVEKEY=NS+(PREVIEW?'save_preview':'save');
const DIRS=[[0,1],[-1,0],[1,0],[0,-1]]; // 下 左 右 上（歩行グラの行順）
const $=s=>document.querySelector(s);
const cv=$('#cv'), ctx=cv.getContext('2d');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const END={};
let G=null,S=null,map=null,tsImg=null,parImg=null,blocked=new Set(),events=[],scale=2,busy=false,menuOpen=false;
const P={x:0,y:0,px:0,py:0,tx:0,ty:0,dir:0,moving:false,anim:0};

/* ---------- ファイル ---------- */
let _db=null;
function db(){return _db||(_db=new Promise((res,rej)=>{const r=indexedDB.open(NS,1);r.onupgradeneeded=()=>r.result.createObjectStore('files');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))}
async function idbGet(k){try{const d=await db();return await new Promise(res=>{const q=d.transaction('files').objectStore('files').get(k);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)})}catch(e){return null}}
const imgP={},imgR={};
function loadImg(path){
  if(!path)return Promise.resolve(null);
  if(imgP[path])return imgP[path];
  return imgP[path]=(async()=>{
    let src=path;
    if(PREVIEW){const f=await idbGet(path);src=f?URL.createObjectURL(new Blob([f.buf],{type:f.type||'image/png'})):path+'?t='+Date.now()}
    const im=await new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src});
    imgR[path]=im;return im;
  })();
}
const charsetOf=id=>G.charsets.find(c=>c.id===id);
function charImg(id){const c=charsetOf(id);if(!c)return null;if(!imgP[c.image])loadImg(c.image);return imgR[c.image]||null}

async function loadData(){
  if(PREVIEW){const s=localStorage.getItem(NS+'draft');if(s)return JSON.parse(s)}
  const r=await fetch('data/game.json?t='+Date.now());
  if(!r.ok)throw new Error(r.status);
  return r.json();
}
function normalize(g){
  g.tileSize=g.tileSize||32;
  for(const k of['tilesets','charsets','faces','parallaxes','pictures','stills','items','maps','switches','variables'])g[k]=g[k]||[];
  g.player=g.player||{map:g.maps[0]&&g.maps[0].id,x:0,y:0,dir:0};
  g.system=Object.assign({slots:['朝','昼','夜'],startDay:1,hud:true},g.system||{});
  g.shop=Object.assign({count:3,limit:1,startMoney:0,pool:[]},g.shop||{});
  for(const m of g.maps){m.events=m.events||[];for(const e of m.events){e.pages=e.pages||[];for(const p of e.pages){p.cond=p.cond||[];p.cmds=p.cmds||[]}}}
}

/* ---------- 入力 ---------- */
const held=[];let aPressed=false,needRelease=false;
function press(d){if(!held.includes(d))held.push(d)}
function release(d){const i=held.indexOf(d);if(i>=0)held.splice(i,1)}
function curDir(){if(needRelease){if(!held.length)needRelease=false;return null}return held.length?held[held.length-1]:null}
const KEY={ArrowDown:0,ArrowLeft:1,ArrowRight:2,ArrowUp:3,s:0,a:1,d:2,w:3};
let dash=false;
const OK_KEYS=['Enter',' ','z','Z'],CANCEL_KEYS=['Escape','x','X','Backspace'];
// 今キーボードで操作するボタンの集まり（タイトル・メニュー・選択肢・交換機）
function navBox(){
  if($('#shop').classList.contains('show'))return $('#shop');
  if($('#title').style.display==='flex')return $('#title');
  if(menuOpen)return $('#menu');
  if(chEl.style.display==='flex')return chEl;
  return null}
function navBtns(box){return[...box.querySelectorAll('button')].filter(b=>!b.disabled&&b.offsetParent!==null&&!(box.id==='shop'&&b.dataset.tab))}
function navMove(box,d){const bs=navBtns(box);if(!bs.length)return;let i=bs.findIndex(b=>b.classList.contains('kf'));
  bs.forEach(b=>b.classList.remove('kf'));i=i<0?0:(i+d+bs.length)%bs.length;bs[i].classList.add('kf');bs[i].scrollIntoView({block:'nearest'})}
function navOk(box){const b=box.querySelector('button.kf');if(!b){navMove(box,0);return}
  if(box===chEl)b.dispatchEvent(new Event('pointerdown',{bubbles:true}));else b.click()}
addEventListener('keydown',e=>{
  if(e.key==='Shift'){dash=true;return}
  const box=navBox();
  if(box){
    if(e.key==='ArrowUp'||e.key==='w'){e.preventDefault();navMove(box,-1);return}
    if(e.key==='ArrowDown'||e.key==='s'){e.preventDefault();navMove(box,1);return}
    if(box.id==='shop'&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){e.preventDefault();const t=box.querySelector('[data-tab]:not(.on)');if(t){t.click();navMove(box,0)}return}
    if(OK_KEYS.includes(e.key)){e.preventDefault();if(!e.repeat)navOk(box);return}
    if(CANCEL_KEYS.includes(e.key)){e.preventDefault();if(box.id==='shop')$('#shopClose').click();else if(box.id==='menu'){if($('#items').style.display==='block')$('#items').style.display='none';else toggleMenu(false)}return}
    return}
  if(e.key in KEY){press(KEY[e.key]);e.preventDefault()}
  else if(OK_KEYS.includes(e.key)){e.preventDefault();if(e.repeat)return;if(busy)advance();else aPressed=true}
  else if(CANCEL_KEYS.includes(e.key)){e.preventDefault();if(!busy)toggleMenu(true)}
});
addEventListener('keyup',e=>{if(e.key==='Shift')dash=false;if(e.key in KEY)release(KEY[e.key])});
addEventListener('blur',()=>{held.length=0;dash=false});
// マウスを乗せたボタンにカーソルを合わせる
document.addEventListener('mouseover',e=>{const b=e.target.closest&&e.target.closest('button');const box=navBox();if(!b||!box||!box.contains(b)||!navBtns(box).includes(b))return;navBtns(box).forEach(x=>x.classList.remove('kf'));b.classList.add('kf')});
// タッチ操作の端末だけ十字キー・Aボタンを出す
if(!(matchMedia('(pointer:coarse)').matches||'ontouchstart' in window))document.body.classList.add('notouch');
addEventListener('touchstart',()=>document.body.classList.remove('notouch'),{passive:true});
const pad=$('#pad');let padD=null;
function padAt(e){const r=pad.getBoundingClientRect();const x=(e.clientX-r.left)/r.width*150-75,y=(e.clientY-r.top)/r.height*150-75;if(Math.hypot(x,y)<12)return padD;return Math.abs(x)>Math.abs(y)?(x<0?1:2):(y<0?3:0)}
function setPad(d){if(padD===d)return;if(padD!=null)release(padD);padD=d;if(d!=null)press(d);pad.querySelectorAll('b').forEach(b=>b.classList.toggle('on',+b.dataset.d===d))}
pad.addEventListener('pointerdown',e=>{e.preventDefault();pad.setPointerCapture(e.pointerId);setPad(padAt(e))});
pad.addEventListener('pointermove',e=>{if(pad.hasPointerCapture(e.pointerId))setPad(padAt(e))});
pad.addEventListener('pointerup',()=>setPad(null));pad.addEventListener('pointercancel',()=>setPad(null));
const abtn=$('#abtn');
abtn.addEventListener('pointerdown',e=>{e.preventDefault();abtn.classList.add('on');if(busy)advance();else aPressed=true});
abtn.addEventListener('pointerup',()=>abtn.classList.remove('on'));abtn.addEventListener('pointercancel',()=>abtn.classList.remove('on'));
const tapEl=$('#tap');
tapEl.addEventListener('pointerdown',e=>{e.preventDefault();advance()});
function showControls(v){for(const el of[pad,abtn,$('#menuBtn')])el.classList.toggle('hide',!v)}

/* ---------- 日付・時間帯・価値 ---------- */
const slotName=i=>G.system.slots[i]??'';
function updHud(){const h=$('#hud');if(!S||!G.system.hud){h.style.display='none';return}h.style.display='block';h.textContent=`${S.day}日目 ${slotName(S.slot)}　価値 ${S.money}`}
// 日ごとの配置：下の行ほど優先。当てはまる行がなければ「いない」
function placement(d){const L=d.schedule;for(let i=L.length-1;i>=0;i--){const r=L[i];
  if(S.day>=(r.from||1)&&(r.to==null||r.to===''||S.day<=r.to)&&(r.slot==null||r.slot<0||r.slot===S.slot))return r.map?r:null}return null}
function mkEv(d,home,x,y,fixDir){return{d,home,x,y,dir:0,fixDir,page:undefined,erased:false}}
function placeScheduled(){
  if(!map)return;events=events.filter(e=>!e.sched);
  for(const m of G.maps)for(const d of m.events){if(!(d.schedule&&d.schedule.length))continue;const p=placement(d);
    if(p&&+p.map===map.id){const e=mkEv(d,m.id,p.x,p.y,p.dir!=null&&p.dir>=0?p.dir:null);e.sched=true;events.push(e)}}
  refresh();
}
// 品ぞろえ表から重み付きで抽選（同じ品は1日1つ）
function drawShop(){
  const pool=G.shop.pool.filter((r,i)=>G.items.some(it=>it.id===r.item)&&S.day>=(r.from||1)&&(r.to==null||r.to===''||S.day<=r.to)&&(r.sw==null||r.sw<0||S.sw[r.sw])&&!(r.once&&S.once[i]));
  const out=[],cand=pool.map(r=>({r,w:Math.max(0,r.weight==null?1:+r.weight)})).filter(c=>c.w>0);
  for(let n=0;n<(G.shop.count||3)&&cand.length;n++){const tot=cand.reduce((a,c)=>a+c.w,0);let x=Math.random()*tot,k=0;for(;k<cand.length-1;k++){x-=cand[k].w;if(x<0)break}
    out.push({p:G.shop.pool.indexOf(cand[k].r),sold:false});cand.splice(k,1)}
  return out;
}
async function nextDay(){
  hideMsg();await fade(1);S.day++;S.slot=0;S.buys=0;S.shop=drawShop();
  const dc=$('#daycard');dc.querySelector('b').textContent=`${S.day}日目`;dc.querySelector('span').textContent=slotName(0);dc.classList.add('show');
  await sleep(1300);placeScheduled();updHud();dc.classList.remove('show');await sleep(500);await fade(0);
}
/* ---------- 等価交換機 ---------- */
function openShop(){return new Promise(res=>{
  const box=$('#shop'),list=box.querySelector('.list'),msg=box.querySelector('.msg');let tab='buy';msg.textContent='';
  const item=id=>G.items.find(i=>i.id===id);
  function render(){
    $('#shopMoney').textContent=`価値 ${S.money}`;$('#shopLimit').textContent=`本日の取り出し ${S.buys}/${S.buyLimit}`;
    box.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));list.innerHTML='';
    const card=(name,desc,btnL,fn,dis,sold)=>{const c=document.createElement('div');c.className='card'+(sold?' sold':'');const d=document.createElement('div');
      d.innerHTML='<b></b><small></small>';d.querySelector('b').textContent=name;d.querySelector('small').textContent=desc||'';const b=document.createElement('button');b.className='ui-btn';b.textContent=btnL;
      if(dis)b.disabled=true;b.onclick=fn;c.append(d,b);list.append(c)};
    if(tab==='buy'){if(!S.shop.length)list.textContent='今日は何も並んでいない';
      for(const sl of S.shop){const r=G.shop.pool[sl.p],it=r&&item(r.item);if(!it)continue;
        card(it.name,(it.desc||'')+(r.limitUp?`（取り出し回数+${r.limitUp}）`:''),sl.sold?'交換済み':`価値 ${r.price}`,()=>buy(sl),sl.sold,sl.sold)}}
    else{const own=G.items.filter(i=>(S.it[i.id]||0)>0&&(+i.value||0)>0);if(!own.length)list.textContent='入れられる物を持っていない';
      for(const it of own)card(`${it.name} ×${S.it[it.id]}`,it.desc,`価値 ${it.value} にする`,()=>sell(it))}
  }
  function buy(sl){const r=G.shop.pool[sl.p],it=item(r.item);
    if(S.buys>=S.buyLimit){msg.textContent='オーバーヒート中…今日はもう取り出せない';return}
    if(S.money<(+r.price||0)){msg.textContent='価値が足りない';return}
    S.money-=(+r.price||0);S.it[it.id]=(S.it[it.id]||0)+1;S.buys++;sl.sold=true;if(r.once)S.once[sl.p]=true;if(r.limitUp)S.buyLimit+=+r.limitUp;
    msg.textContent=`${it.name}を手に入れた`;render();updHud();navMove(box,0)}
  function sell(it){if(!confirm(`${it.name}を入れて、価値 ${it.value} に変えますか？`))return;S.it[it.id]--;S.money+=(+it.value||0);msg.textContent=`価値 ${it.value} になった`;render();updHud();navMove(box,0)}
  box.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;msg.textContent='';render();navMove(box,0)});
  $('#shopClose').onclick=()=>{box.classList.remove('show');refresh();res()};
  render();box.classList.add('show');navMove(box,0);
})}

/* ---------- マップ ---------- */
async function loadMap(id,x,y,dir){
  const m=G.maps.find(m=>m.id===+id);
  if(!m){alert('マップ '+id+' がありません');return}
  map=m;
  const t=G.tilesets.find(t=>t.id===m.tileset)||G.tilesets[0]||null;
  blocked=new Set(t?t.blocked||[]:[]);
  tsImg=t?await loadImg(t.image):null;
  const pr=m.parallax&&G.parallaxes.find(p=>p.id===m.parallax.id);parImg=pr?await loadImg(pr.image):null;
  events=m.events.filter(d=>!(d.schedule&&d.schedule.length)).map(d=>mkEv(d,m.id,d.x,d.y,null));
  const ts=G.tileSize;
  clearPath();P.x=P.tx=x;P.y=P.ty=y;P.px=x*ts;P.py=y*ts;P.moving=false;
  if(dir!=null&&dir>=0)P.dir=dir;
  S.map=m.id;
  placeScheduled();updHud();
  charImg(G.player.charset);
}
function evalCond(c,cx){
  switch(c.type){
    case'sw':return !!S.sw[c.id]===!!c.val;
    case'var':{const a=S.vr[c.id]||0,b=+c.val||0;return c.op==='=='?a===b:c.op==='!='?a!==b:c.op==='>='?a>=b:c.op==='<='?a<=b:c.op==='>'?a>b:a<b}
    case'item':return((S.it[c.id]||0)>0)===!!c.has;
    case'self':return !!S.ss[cx.ev.home+':'+cx.ev.d.id+':'+c.key]===!!c.val;
    case'day':case'money':{const a=c.type==='day'?S.day:S.money,b=+c.val||0;return c.op==='=='?a===b:c.op==='!='?a!==b:c.op==='>='?a>=b:c.op==='<='?a<=b:c.op==='>'?a>b:a<b}
    case'slot':return(S.slot===+c.val)===(c.op!=='!=');
  }
  return true;
}
function refresh(){
  if(!map)return;
  for(const e of events){
    const ps=e.d.pages;let pg=null;
    for(let i=ps.length-1;i>=0;i--){if(ps[i].cond.every(c=>evalCond(c,{mapId:map.id,ev:e}))){pg=ps[i];break}}
    if(pg!==e.page){e.page=pg;if(pg&&pg.image){e.dir=e.fixDir!=null?e.fixDir:(pg.image.dir||0);if(pg.image.charset)charImg(pg.image.charset)}}
  }
}
function evAt(x,y,f){return events.find(e=>!e.erased&&e.page&&e.x===x&&e.y===y&&f(e))}
function passable(x,y){
  if(x<0||y<0||x>=map.w||y>=map.h)return false;
  const i=y*map.w+x;
  for(const l of[0,1]){const v=map.layers[l]&&map.layers[l][i];if(v>=0&&blocked.has(v))return false}
  if(evAt(x,y,e=>e.page.priority!=='below'&&!e.page.through))return false;
  return true;
}
function onArrive(){const e=evAt(P.x,P.y,e=>e.page.priority==='below'&&e.page.trigger==='touch');if(e)runEvent(e)}
function checkAction(){
  let e=evAt(P.x,P.y,e=>e.page.priority==='below'&&e.page.trigger!=='auto');
  if(!e){const nx=P.x+DIRS[P.dir][0],ny=P.y+DIRS[P.dir][1];e=evAt(nx,ny,e=>e.page.priority!=='below'&&e.page.trigger!=='auto');if(e&&e.page.image&&e.page.image.charset)e.dir=3-P.dir}
  if(e){runEvent(e);return true}return false;
}
function checkBump(x,y){const e=evAt(x,y,e=>e.page.priority!=='below'&&e.page.trigger==='touch');if(e){runEvent(e);return true}return false}
function checkAuto(){const e=events.find(e=>!e.erased&&e.page&&e.page.trigger==='auto');if(e)runEvent(e)}

/* ---------- イベント実行 ---------- */
async function runEvent(ev){
  busy=true;aPressed=false;setPad(null);held.length=0;clearPath();showControls(false);tapEl.style.display='block';
  const cx={ev,mapId:map.id};
  try{await exec(ev.page.cmds,cx)}catch(e){if(e!==END)console.error(e)}
  hideMsg();clearPics();showStill(null,false);busy=false;tapEl.style.display='none';showControls(true);needRelease=true;refresh();
}
async function exec(list,cx){for(const c of list||[])await cmd(c,cx)}
async function cmd(c,cx){
  switch(c.t){
    case'text':await showText(c);break;
    case'choice':{const i=await showChoice(c.options.map(o=>o.label));await exec(c.options[i].cmds,cx);break}
    case'if':await exec(evalCond(c.cond,cx)?c.then:(c.hasElse?c.else:[]),cx);break;
    case'sw':S.sw[c.id]=!!c.val;refresh();break;
    case'var':{let v=S.vr[c.id]||0;const n=+c.val||0;v=c.op==='set'?n:c.op==='add'?v+n:c.op==='sub'?v-n:c.op==='rand'?Math.floor(Math.random()*(n+1)):v;S.vr[c.id]=v;refresh();break}
    case'self':S.ss[cx.ev.home+':'+cx.ev.d.id+':'+c.key]=!!c.val;refresh();break;
    case'time':{const n=G.system.slots.length;S.slot=c.op==='set'?Math.max(0,Math.min(n-1,+c.slot||0)):Math.min(n-1,S.slot+(+c.n||1));placeScheduled();updHud();break}
    case'sleep':await nextDay();break;
    case'money':{const n=+c.val||0;S.money=Math.max(0,c.op==='set'?n:c.op==='sub'?S.money-n:S.money+n);updHud();refresh();break}
    case'buylimit':S.buyLimit=Math.max(0,c.op==='set'?+c.val||0:S.buyLimit+(+c.val||0));break;
    case'shop':hideMsg();await openShop();break;
    case'item':S.it[c.id]=Math.max(0,(S.it[c.id]||0)+(+c.n||0));refresh();break;
    case'move':hideMsg();await fade(1);await loadMap(c.map,c.x,c.y,c.dir);await fade(0);break;
    case'wait':await sleep(+c.ms||0);break;
    case'pic':if(c.pos==='A')clearPics();else{await setPic(c.pos||'C',c.id||null);if(c.id)setActive(c.pos||'C')}break;
    case'still':await showStill(c.id||null,c.fade!==false);break;
    case'erase':cx.ev.erased=true;break;
    case'end':throw END;
  }
}
const msgEl=$('#msg'),faceEl=$('#face'),nameEl=$('#mname'),textEl=$('#mtext'),arrowEl=$('#arrow'),chEl=$('#choices');
let onAdvance=null;
function advance(){if(onAdvance)onAdvance()}
function tokenize(s){
  const out=[],re=/\[w=(\d+)\]|\[shake\]|\[v=(\d+)\]|\[(day|slot|money)\]/g;let i=0,m;
  const push=str=>{for(const ch of str)out.push({s:ch})};
  while((m=re.exec(s))){push(s.slice(i,m.index));if(m[1]!=null)out.push({w:+m[1]});else if(m[2]!=null)push(String(S.vr[+m[2]-1]||0));else if(m[3])push(String(m[3]==='day'?S.day:m[3]==='slot'?slotName(S.slot):S.money));else out.push({shake:1});i=re.lastIndex}
  push(s.slice(i));return out;
}
function waitMs(ms,skip){return new Promise(r=>{const t0=performance.now();(function f(){if(skip()||performance.now()-t0>=ms)r();else requestAnimationFrame(f)})()})}
/* ---------- 立ち絵・スチル ---------- */
const PIC={L:$('#picL'),C:$('#picC'),R:$('#picR')};
async function setPic(pos,id){const el=PIC[pos];if(!el)return;const p=id&&G.pictures.find(x=>x.id===id);
  if(!p){el.classList.remove('show');el.dataset.id='';return}
  if(el.dataset.id===id&&el.classList.contains('show'))return;const im=await loadImg(p.image);if(!im)return;el.src=im.src;el.dataset.id=id;void el.offsetWidth;el.classList.add('show')}
function setActive(pos){for(const k in PIC)PIC[k].classList.toggle('dim',k!==pos&&PIC[k].classList.contains('show'))}
function clearPics(){for(const k in PIC){PIC[k].classList.remove('show','dim');PIC[k].dataset.id=''}}
async function showStill(id,fade){const box=$('#still'),img=box.querySelector('img');const st=id&&G.stills.find(x=>x.id===id);
  if(!st){if(box.classList.contains('show')){box.classList.remove('show');if(fade)await sleep(400)}return}
  const im=await loadImg(st.image);if(!im)return;
  if(box.classList.contains('show')&&fade){box.classList.remove('show');await sleep(400)}
  img.src=im.src;box.style.transition=fade?'':'none';void box.offsetWidth;box.classList.add('show');if(fade)await sleep(400);box.style.transition=''}
async function showText(c){
  if(c.pic==='-')setPic(c.picPos||'C',null);
  else if(c.pic){await setPic(c.picPos||'C',c.pic);setActive(c.picPos||'C')}
  msgEl.classList.add('show');
  const f=G.faces.find(x=>x.id===c.face);
  const fim=f?await loadImg(f.image):null;
  if(fim){faceEl.src=fim.src;faceEl.style.display='block'}else faceEl.style.display='none';
  nameEl.textContent=c.name||'';nameEl.style.display=c.name?'block':'none';
  // [p] で改ページ（前後の改行は無視）
  for(const page of (c.text||'').split(/\n?\[p\]\n?/)){
    textEl.textContent='';arrowEl.style.display='none';
    let skip=false,typing=true;
    const done=new Promise(r=>{onAdvance=()=>{if(typing)skip=true;else{onAdvance=null;r()}}});
    for(const tk of tokenize(page)){
      if(tk.w!=null){if(!skip)await waitMs(tk.w,()=>skip)}
      else if(tk.shake){if(!skip){msgEl.classList.remove('shake');void msgEl.offsetWidth;msgEl.classList.add('shake')}}
      else{textEl.textContent+=tk.s;if(!skip)await waitMs(28,()=>skip)}
    }
    typing=false;arrowEl.style.display='block';
    await done;arrowEl.style.display='none';
  }
}
function showChoice(labels){
  return new Promise(r=>{
    onAdvance=null;chEl.innerHTML='';
    labels.forEach((l,i)=>{const b=document.createElement('button');b.className='ui-btn';b.textContent=l;
      b.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();chEl.style.display='none';r(i)});chEl.append(b)});
    chEl.style.display='flex';navMove(chEl,0);
  });
}
function hideMsg(){msgEl.classList.remove('show');chEl.style.display='none';onAdvance=null}
function fade(v){$('#fade').style.opacity=v;return sleep(270)}

/* ---------- タップ（クリック）で移動 ---------- */
let path=[],pathFace=null,pathGoal=null,cam={x:0,y:0};
// 目的地まで最短ルートを探す。通れないマス（人や物）なら隣まで行ってそちらを向く
function findPath(tx,ty){
  const W=map.w,H=map.h,sx=P.moving?P.tx:P.x,sy=P.moving?P.ty:P.y;if(tx<0||ty<0||tx>=W||ty>=H)return null;
  const goals=new Map();
  if((tx===sx&&ty===sy)||passable(tx,ty))goals.set(ty*W+tx,null);
  else for(let d=0;d<4;d++){const ax=tx-DIRS[d][0],ay=ty-DIRS[d][1];if(ax<0||ay<0||ax>=W||ay>=H)continue;if((ax===sx&&ay===sy)||passable(ax,ay))goals.set(ay*W+ax,d)}
  if(!goals.size)return null;
  const prev=new Int32Array(W*H).fill(-1),pd=new Int8Array(W*H),q=[sy*W+sx];prev[sy*W+sx]=sy*W+sx;
  for(let qi=0;qi<q.length;qi++){const i=q[qi];if(goals.has(i)){const dirs=[];let j=i;while(j!==sy*W+sx){dirs.unshift(pd[j]);j=prev[j]}return{dirs,face:goals.get(i)}}
    const x=i%W,y=(i-x)/W;for(let d=0;d<4;d++){const nx=x+DIRS[d][0],ny=y+DIRS[d][1];if(nx<0||ny<0||nx>=W||ny>=H)continue;const n=ny*W+nx;if(prev[n]>=0||!passable(nx,ny))continue;prev[n]=i;pd[n]=d;q.push(n)}}
  return null;
}
function clearPath(){path=[];pathFace=null;pathGoal=null}
cv.addEventListener('pointerdown',e=>{
  if(!map||!S||busy||menuOpen)return;e.preventDefault();
  const r=cv.getBoundingClientRect(),bx=(e.clientX-r.left)*cv.width/r.width,by=(e.clientY-r.top)*cv.height/r.height,ts=G.tileSize;
  const tx=Math.floor((bx/scale+cam.x)/ts),ty=Math.floor((by/scale+cam.y)/ts);
  const res=findPath(tx,ty);if(!res){clearPath();return}
  path=res.dirs;pathFace=res.face;pathGoal={x:tx,y:ty,t:performance.now()};
});

/* ---------- 更新・描画 ---------- */
function update(){
  if(!map||!S)return;
  const ts=G.tileSize,sp=Math.max(1,ts/8)*(dash&&!busy?2:1);
  if(P.moving){
    const gx=P.tx*ts,gy=P.ty*ts;
    P.px+=Math.sign(gx-P.px)*Math.min(sp,Math.abs(gx-P.px));
    P.py+=Math.sign(gy-P.py)*Math.min(sp,Math.abs(gy-P.py));
    P.anim++;
    if(P.px===gx&&P.py===gy){P.moving=false;P.x=P.tx;P.y=P.ty;if(!busy)onArrive()}
  }
  if(P.moving||busy||menuOpen)return;
  if(aPressed){aPressed=false;if(checkAction())return}
  let d=curDir();
  if(d!=null)clearPath();
  else if(path.length){d=path[0];const nx=P.x+DIRS[d][0],ny=P.y+DIRS[d][1];if(passable(nx,ny))path.shift();else{P.dir=d;clearPath();d=null;if(checkBump(nx,ny))return}}
  else if(pathFace!=null){P.dir=pathFace;pathFace=null;pathGoal=null;if(checkAction())return}
  else if(pathGoal&&P.x===pathGoal.x&&P.y===pathGoal.y)pathGoal=null;
  if(d!=null){
    P.dir=d;const nx=P.x+DIRS[d][0],ny=P.y+DIRS[d][1];
    if(passable(nx,ny)){P.tx=nx;P.ty=ny;P.moving=true;if(!P.anim)P.anim=1}
    else{P.anim=0;if(checkBump(nx,ny))return}
  }else P.anim=0;
  if(!busy)checkAuto();
}
// 横長（PC・横持ち）は 816×624（17×13マス）の画面を拡大表示。縦持ちスマホは全画面
const BASE_W=816,BASE_H=624;let fixedMode=false,uiK=1;
function resize(){
  const iw=innerWidth,ih=innerHeight,scr=$('#screen'),dpr=devicePixelRatio||1,ts=G?G.tileSize:48;
  fixedMode=iw>=ih;
  if(fixedMode){uiK=Math.min(iw/BASE_W,ih/BASE_H);scr.style.width=BASE_W+'px';scr.style.height=BASE_H+'px';
    scr.style.transform=`translate(${Math.round((iw-BASE_W*uiK)/2)}px,${Math.round((ih-BASE_H*uiK)/2)}px) scale(${uiK})`;
    cv.width=Math.round(BASE_W*uiK*dpr);cv.height=Math.round(BASE_H*uiK*dpr);scale=cv.width/(17*ts)}
  else{uiK=1;scr.style.width=iw+'px';scr.style.height=ih+'px';scr.style.transform='none';
    cv.width=Math.round(iw*dpr);cv.height=Math.round(ih*dpr);scale=Math.max(1,Math.round(Math.min(cv.width,cv.height)/(ts*11)))}
}
addEventListener('resize',resize);
function tileDraw(v,x,y){const ts=G.tileSize,cols=Math.floor(tsImg.width/ts);if(!cols)return;ctx.drawImage(tsImg,(v%cols)*ts,Math.floor(v/cols)*ts,ts,ts,x,y,ts,ts)}
function layer(l,x0,y0,x1,y1){const L=map.layers[l];if(!L||!tsImg)return;const ts=G.tileSize;for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){const v=L[y*map.w+x];if(v>=0)tileDraw(v,x*ts,y*ts)}}
// 歩行グラ：縦長=1キャラ(3x4コマ)、横長=8キャラ並び(12x8コマ)。index で何人目かを指定
function charRect(im,index,dir,frame){const m=im.width>im.height,fw=im.width/(m?12:3),fh=im.height/(m?8:4),i=m?(index||0):0;return[((i%4)*3+frame)*fw,(Math.floor(i/4)*4+dir)*fh,fw,fh]}
function drawChar(cs,im,dir,frame,px,py){const ts=G.tileSize,[sx,sy,fw,fh]=charRect(im,cs.index,dir,frame);ctx.drawImage(im,sx,sy,fw,fh,Math.round(px+ts/2-fw/2),Math.round(py+ts-fh),fw,fh)}
function drawEv(e){const im=e.page.image,ts=G.tileSize;if(im.tile!=null){if(tsImg)tileDraw(im.tile,e.x*ts,e.y*ts)}else{const ci=charImg(im.charset);if(ci)drawChar(charsetOf(im.charset),ci,e.dir,1,e.x*ts,e.y*ts)}}
function drawPlayer(){const ci=charImg(G.player.charset);if(!ci)return;const f=P.anim?[1,2,1,0][Math.floor(P.anim/8)%4]:1;drawChar(charsetOf(G.player.charset),ci,P.dir,f,P.px,P.py)}
function draw(){
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#000';ctx.fillRect(0,0,cv.width,cv.height);
  if(!map)return;
  const ts=G.tileSize,vw=cv.width/scale,vh=cv.height/scale,mw=map.w*ts,mh=map.h*ts;
  let cx=mw>vw?Math.min(Math.max(P.px+ts/2-vw/2,0),mw-vw):(mw-vw)/2;
  let cy=mh>vh?Math.min(Math.max(P.py+ts/2-vh/2,0),mh-vh):(mh-vh)/2;
  cx=Math.round(cx*scale)/scale;cy=Math.round(cy*scale)/scale;cam.x=cx;cam.y=cy;
  ctx.setTransform(scale,0,0,scale,-cx*scale,-cy*scale);ctx.imageSmoothingEnabled=false;
  const x0=Math.max(0,Math.floor(cx/ts)),y0=Math.max(0,Math.floor(cy/ts)),x1=Math.min(map.w,Math.ceil((cx+vw)/ts)+1),y1=Math.min(map.h,Math.ceil((cy+vh)/ts)+1);
  if(parImg&&parImg.width){const pp=map.parallax,r=(pp.rate??20)/100,iw=parImg.width,ih=parImg.height,t=performance.now()/1000;
    const ox=cx*(1-r)+(pp.sx||0)*t,oy=cy*(1-r)+(pp.sy||0)*t,sx0=ox+Math.floor((cx-ox)/iw)*iw,sy0=oy+Math.floor((cy-oy)/ih)*ih;
    for(let y=sy0;y<cy+vh;y+=ih)for(let x=sx0;x<cx+vw;x+=iw)ctx.drawImage(parImg,Math.round(x*scale)/scale,Math.round(y*scale)/scale)}
  layer(0,x0,y0,x1,y1);layer(1,x0,y0,x1,y1);layer(2,x0,y0,x1,y1);
  const list=[];
  for(const e of events){if(e.erased||!e.page||!e.page.image)continue;list.push({z:e.page.priority==='below'?0:1,y:e.y*ts,f:()=>drawEv(e)})}
  list.push({z:1,y:P.py,f:drawPlayer});
  list.sort((a,b)=>a.z-b.z||a.y-b.y);for(const o of list)o.f();
  layer(3,x0,y0,x1,y1);
  if(pathGoal){const a=.45+.35*Math.sin(performance.now()/120);ctx.strokeStyle=`rgba(255,255,255,${a})`;ctx.lineWidth=3/scale*2;ctx.strokeRect(pathGoal.x*ts+4,pathGoal.y*ts+4,ts-8,ts-8);ctx.strokeStyle=`rgba(0,0,0,${a})`;ctx.lineWidth=1/scale*2;ctx.strokeRect(pathGoal.x*ts+7,pathGoal.y*ts+7,ts-14,ts-14)}
}
function loop(){update();draw();requestAnimationFrame(loop)}

/* ---------- メニュー・タイトル ---------- */
function toggleMenu(v){menuOpen=v==null?!menuOpen:v;$('#menu').style.display=menuOpen?'flex':'none';$('#items').style.display='none';if(menuOpen){$('#menu').querySelectorAll('.kf').forEach(b=>b.classList.remove('kf'));navMove($('#menu'),0)}}
$('#menuBtn').addEventListener('click',()=>toggleMenu(true));
$('#menu').addEventListener('click',e=>{
  const m=e.target.dataset&&e.target.dataset.m;if(!m)return;
  if(m==='close')toggleMenu(false);
  if(m==='items'){const it=$('#items');const own=G.items.filter(i=>(S.it[i.id]||0)>0);it.innerHTML='';
    it.textContent='';const hd=document.createElement('div');hd.textContent=`${S.day}日目 ${slotName(S.slot)}　価値 ${S.money}`;hd.style.cssText='border-bottom:1px solid #fff;margin-bottom:4px';it.append(hd);
    if(!own.length)it.append('なにも持っていない');
    for(const i of own){const d=document.createElement('div');d.textContent=`${i.name} ×${S.it[i.id]}`+(i.desc?`　${i.desc}`:'');it.append(d)}
    it.style.display='block'}
  if(m==='save'){S.x=P.x;S.y=P.y;S.dir=P.dir;localStorage.setItem(SAVEKEY,JSON.stringify(S));e.target.textContent='セーブしました';setTimeout(()=>e.target.textContent='セーブ',1200)}
  if(m==='load')loadGame();
});
async function loadGame(){const s=localStorage.getItem(SAVEKEY);if(!s){alert('セーブデータがありません');return}S=JSON.parse(s);S=Object.assign({once:{},day:1,slot:0,money:0,buys:0,buyLimit:+G.shop.limit||1},S);if(!S.shop)S.shop=drawShop();toggleMenu(false);$('#title').style.display='none';await fade(1);await loadMap(S.map,S.x,S.y,S.dir);await fade(0)}
async function startNew(){
  const p=G.player;S={map:p.map,x:p.x,y:p.y,dir:p.dir||0,sw:{},vr:{},it:{},ss:{},once:{},day:G.system.startDay||1,slot:0,money:+G.shop.startMoney||0,buys:0,buyLimit:+G.shop.limit||1};S.shop=drawShop();
  if(PREVIEW&&Q.has('map')){S.map=+Q.get('map');S.x=+Q.get('x')||0;S.y=+Q.get('y')||0}
  await loadMap(S.map,S.x,S.y,S.dir);
}
function showTitle(){
  $('#ttl').textContent=G.title||'';$('#title').style.display='flex';
  $('#tCont').classList.toggle('hide',!localStorage.getItem(SAVEKEY));
  $('#tNew').onclick=async()=>{$('#title').style.display='none';await startNew()};
  $('#tCont').onclick=loadGame;
  $('#title').querySelectorAll('.kf').forEach(b=>b.classList.remove('kf'));navMove($('#title'),0);
}
(async()=>{
  try{G=await loadData()}catch(e){document.body.innerHTML='<p style="padding:20px;color:#fff">data/game.json を読み込めませんでした。</p>';return}
  normalize(G);document.title=G.title||'RPG';resize();
  for(const c of G.charsets)loadImg(c.image);
  loop();
  if(PREVIEW)startNew();else showTitle();
})();
</script>
