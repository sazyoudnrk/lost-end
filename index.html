<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>RPG</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:#fff;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:system-ui,-apple-system,"Hiragino Sans",sans-serif}
#cv{position:absolute;left:0;top:0;width:100%;height:100%;image-rendering:pixelated;display:block}
#tap{position:absolute;inset:0;z-index:5;display:none}
.ni-l::before{content:'\540D\524D\3092\5165\529B\3057\3066\304F\3060\3055\3044'}
input[type=search]::-webkit-search-cancel-button{display:none}
#pics{position:absolute;inset:0;z-index:3;pointer-events:none;overflow:hidden}
#pics img{position:absolute;bottom:0;height:78%;max-width:96%;object-fit:contain;object-position:bottom;opacity:0;transition:opacity .25s,filter .25s;image-rendering:auto}
#pics img.show{opacity:1}
#pics img.dim{filter:brightness(.55)}
#picL{left:-4%}#picC{left:50%;transform:translateX(-50%)}#picR{right:-4%}
#still{position:absolute;inset:0;z-index:4;background:#000;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .4s}
#still.show{opacity:1}
#still img{width:100%;height:100%;object-fit:contain}
#msg{position:absolute;left:8px;right:8px;bottom:calc(14px + env(safe-area-inset-bottom));min-height:118px;background:rgba(12,14,34,.9);border:2px solid #fff;border-radius:10px;padding:16px 12px 14px;display:none;gap:10px;z-index:6;pointer-events:none}
#msg.show{display:flex}
#face{width:96px;height:96px;flex:none;object-fit:contain;display:none;image-rendering:pixelated}
#mname{position:absolute;top:-15px;left:12px;background:rgba(12,14,34,.96);border:2px solid #fff;border-radius:6px;padding:1px 10px;font-size:14px;display:none}
#mtext{flex:1;font-size:17px;line-height:1.65;white-space:pre-wrap;word-break:break-all}
#arrow{position:absolute;right:12px;bottom:4px;display:none;animation:bl 1s infinite}
@keyframes bl{50%{opacity:0}}
.shake{animation:shk .35s}
@keyframes shk{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
#choices{position:absolute;right:10px;bottom:calc(146px + env(safe-area-inset-bottom));display:none;flex-direction:column;gap:6px;z-index:7;max-width:80%}
.ui-btn{background:rgba(12,14,34,.92);color:#fff;border:2px solid #fff;border-radius:8px;padding:10px 18px;font:inherit;font-size:16px;text-align:left;touch-action:manipulation}
#pad{position:absolute;left:14px;bottom:calc(18px + env(safe-area-inset-bottom));width:150px;height:150px;z-index:4;touch-action:none}
#pad b{position:absolute;width:50px;height:50px;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.35);border-radius:10px;pointer-events:none}
#pad b.on{background:rgba(255,255,255,.45)}
#abtn{position:absolute;right:22px;bottom:calc(40px + env(safe-area-inset-bottom));width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.4);z-index:4;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:22px;touch-action:none}
#abtn.on{background:rgba(255,255,255,.45)}
#menuBtn{position:absolute;right:10px;top:calc(10px + env(safe-area-inset-top));z-index:4;padding:6px 14px}
#menu,#title{position:absolute;inset:0;z-index:10;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(0,0,0,.75)}
#title{background:#000}
#title h1{font-size:28px;margin:0 20px 30px;text-align:center}
#menu .ui-btn,#title .ui-btn{min-width:200px;text-align:center}
#items{max-height:50%;overflow:auto;min-width:240px;background:rgba(12,14,34,.92);border:2px solid #fff;border-radius:8px;padding:8px 12px;display:none;line-height:1.8}
#dbgHud{position:absolute;left:calc(10px + env(safe-area-inset-left));top:calc(56px + env(safe-area-inset-top));z-index:45;background:rgba(0,0,0,.72);color:#fff;font-size:12px;line-height:1.5;padding:5px 8px;border-radius:6px;pointer-events:none;white-space:pre}
#dim{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:2;transition:opacity 1.2s}
#flash{position:absolute;inset:0;opacity:0;pointer-events:none;z-index:2;mix-blend-mode:multiply}
#msg.onblack{z-index:21}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.hide{display:none!important}
#dbgBtn{position:absolute;right:178px;top:calc(10px + env(safe-area-inset-top));z-index:4;padding:6px 10px;font-size:14px}
#dbg{position:fixed;inset:0;z-index:50;background:rgba(8,9,22,.97);color:#fff;overflow:auto;padding:calc(12px + env(safe-area-inset-top)) 14px 40px;font-size:15px;-webkit-overflow-scrolling:touch}
#dbg h3{margin:16px 0 6px;font-size:14px;color:#aab}#dbg .r{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid #223}#dbg .r span{flex:1}#dbg input,#dbg select{font:inherit;font-size:16px;background:#1a1c36;color:#fff;border:1px solid #556;border-radius:6px;padding:5px 6px}#dbg input[type=number]{width:80px}#dbg input[type=checkbox]{width:22px;height:22px}#dbg .ui-btn{padding:7px 12px;font-size:14px;text-align:center}#dbg .top{position:sticky;top:-12px;background:rgba(8,9,22,.97);display:flex;gap:8px;padding:6px 0;z-index:1}
#pvBack{position:absolute;right:62px;top:calc(10px + env(safe-area-inset-top));z-index:4;padding:6px 12px;font-size:14px}
#hud{position:absolute;left:10px;top:calc(10px + env(safe-area-inset-top));z-index:4;background:rgba(12,14,34,.85);border:2px solid #fff;border-radius:8px;padding:4px 12px;font-size:14px;pointer-events:none;white-space:nowrap}
#daycard{position:absolute;inset:0;z-index:21;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;opacity:0;pointer-events:none;transition:opacity .5s}
#daycard.show{opacity:1}#daycard b{font-size:34px;letter-spacing:.2em}#daycard span{font-size:16px;color:#aaa}
#shop{position:absolute;inset:0;z-index:40;background:rgba(0,0,0,.88);display:none;flex-direction:column;padding:calc(14px + env(safe-area-inset-top)) 12px calc(14px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
#shop.show{display:flex}
#shop .tabs{display:flex;gap:18px;padding:0 6px;position:relative;z-index:1;margin-bottom:-2px}#shop .tabs .ui-btn{flex:1;text-align:center;padding:9px;font-size:17px;letter-spacing:.15em;border-radius:8px 8px 0 0;opacity:.6}#shop .tabs .ui-btn.on{opacity:1;background:#fff;color:#000}
#shop .frame{flex:1;min-height:0;border:2px solid #fff;border-radius:10px;padding:8px;background:rgba(12,14,34,.92);overflow:auto;-webkit-overflow-scrolling:touch}
#shop .list{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-content:start}
#shop .list>p{grid-column:1/-1;text-align:center;color:#bbb;margin:24px 0}
#shop .icard{display:flex;flex-direction:column;align-items:stretch;gap:4px;padding:6px;border-radius:8px;text-align:left;min-width:0;font-size:14px}
#shop .icard b{font-size:13px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;word-break:break-all;min-height:2.6em}
#shop .icard .im{aspect-ratio:1;background:#fff;border-radius:4px;display:flex;align-items:center;justify-content:center;overflow:hidden}
#shop .icard .im img{width:100%;height:100%;object-fit:contain;image-rendering:pixelated}
#shop .icard small{color:#bbb;font-size:11px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;min-height:3.9em}
#shop .icard .pr{font-size:13px;text-align:right}
#shop .icard.sel{background:#fff;color:#000}#shop .icard.sel small{color:#333}#shop .icard.sel .im{outline:2px solid #000}
#shop .icard.sold{opacity:.35}
#shop .icard.kf:not(.sel){background:rgba(12,14,34,.92);color:#fff;outline:3px dashed #fff;outline-offset:1px}#shop .icard.kf:not(.sel) small{color:#bbb}
#shop .st{display:flex;justify-content:space-between;font-size:14px;color:#ccc;margin:8px 4px 0}
#shop .msg{min-height:22px;text-align:center;font-size:14px;margin:4px 0}
#shop.lock{z-index:2;pointer-events:none}
#shop .tip{display:none;background:#fff;color:#000;border-radius:8px;padding:8px 10px;margin-bottom:8px;font-size:15px;text-align:center}#shop.tut .tip{display:block}
#shop .pulse{animation:pulse 1s ease-in-out infinite}@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.9)}50%{box-shadow:0 0 0 6px rgba(255,255,255,.25)}}
#shop .bar{display:flex;gap:8px}#shop .bar .ui-btn{text-align:center}#shop #shopOk{flex:1;font-size:17px}

#screen{position:fixed;left:0;top:0;overflow:hidden;background:#000;transform-origin:0 0}
.ui-btn.kf{background:#fff;color:#000;box-shadow:0 0 0 2px #000,0 0 0 4px #fff}
.ui-btn:disabled{opacity:.5}
body.notouch #pad,body.notouch #abtn{display:none}
</style>
</head>
<body>
<div id="screen">
<canvas id="cv"></canvas>
<div id="pics"><img id="picL" alt=""><img id="picC" alt=""><img id="picR" alt=""></div>
<div id="still"><img alt=""></div>
<div id="tap"></div>
<div id="msg"><div id="mname"></div><img id="face" alt=""><div id="mtext"></div><div id="arrow">▼</div></div>
<div id="choices"></div>
<div id="pad"><b data-d="3" style="left:50px;top:0"></b><b data-d="1" style="left:0;top:50px"></b><b data-d="2" style="left:100px;top:50px"></b><b data-d="0" style="left:50px;top:100px"></b></div>
<div id="abtn">A</div>
<button id="menuBtn" class="ui-btn">☰</button>
<button id="pvBack" class="ui-btn hide">✕ テスト終了</button><button id="dbgBtn" class="ui-btn hide">🐞</button>
<div id="dbg" class="hide"></div><div id="dbgHud" class="hide"></div>
<div id="menu"><div id="items"></div><button class="ui-btn" data-m="items">アイテム</button><button class="ui-btn" data-m="save">セーブ</button><button class="ui-btn" data-m="load">ロード</button><button class="ui-btn" data-m="memo" style="display:none">メモ</button><button class="ui-btn" data-m="opt">設定</button><button class="ui-btn" data-m="close">閉じる</button></div>
<div id="title"><h1 id="ttl"></h1><button class="ui-btn" id="tNew">はじめから</button><button class="ui-btn" id="tCont">つづきから</button></div>
<div id="hud"></div>
<div id="shop"><div class="tabs"><button class="ui-btn on" data-tab="buy">とりだす</button><button class="ui-btn" data-tab="sell">いれる</button></div><div class="frame"><div class="tip"></div><div class="list"></div></div><div class="st"><span id="shopMoney"></span><span id="shopLimit"></span></div><div class="msg"></div><div class="bar"><button class="ui-btn" id="shopOk" disabled>えらぶ</button><button class="ui-btn" id="shopClose">閉じる</button></div></div>
<div id="daycard"><b></b><span></span></div>
<div id="dim"></div><div id="fade"></div><div id="flash"></div>
</div>
<script>
'use strict';
const GAME_VER='2026-11-13m';
// 公開中の版と違えば、新しい版で開き直す（ブラウザのキャッシュ対策）
(async()=>{try{const r=await fetch('index.html?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;const m=(await r.text()).match(/GAME_VER='([^']+)'/);
  if(m&&m[1]!==GAME_VER&&new URLSearchParams(location.search).get('v')!==m[1]){const q=new URLSearchParams(location.search);q.set('v',m[1]);location.replace('index.html?'+q)}}catch(e){}})();
const NS='rpgmk:'+location.pathname.replace(/[^/]*$/,'');
const Q=new URLSearchParams(location.search);
const PREVIEW=Q.has('preview');
const SAVEKEY=NS+(PREVIEW?'save_preview':'save');
const DIRS=[[0,1],[-1,0],[1,0],[0,-1]]; // 下 左 右 上（歩行グラの行順）
const $=s=>document.querySelector(s);
const cv=$('#cv'), ctx=cv.getContext('2d');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const END={};
let G=null,S=null,map=null,tsImg=null,parImg=null,blocked=new Set(),events=[],scale=2,busy=false,menuOpen=false;
const P={x:0,y:0,px:0,py:0,tx:0,ty:0,dir:0,moving:false,anim:0};

/* ---------- ファイル ---------- */
let _db=null;
function db(){return _db||(_db=new Promise((res,rej)=>{const r=indexedDB.open(NS,1);r.onupgradeneeded=()=>r.result.createObjectStore('files');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))}
async function idbGet(k){try{const d=await db();return await new Promise(res=>{const q=d.transaction('files').objectStore('files').get(k);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)})}catch(e){return null}}
const imgP={},imgR={};
let AC=null;const sndP={};
function audioCtx(){if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C()}if(AC&&AC.state==='suspended')AC.resume();return AC}
// iPhoneはタップ(touchend/click)の中でないと音を出せないので、止まっている間は毎回起こしに行く
try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
['pointerdown','pointerup','touchend','click','keydown'].forEach(t=>addEventListener(t,()=>{const a=audioCtx();if(!a||a.state==='running')return;try{a.resume();const b=a.createBuffer(1,1,22050),s=a.createBufferSource();s.buffer=b;s.connect(a.destination);s.start(0)}catch(e){}},{capture:true}));
function loadSnd(path){if(!path)return Promise.resolve(null);if(sndP[path])return sndP[path];
  return sndP[path]=(async()=>{try{const a=audioCtx();if(!a)return null;let buf=null;
    if(PREVIEW){const f=await idbGet(path);if(f)buf=f.buf.slice(0)}
    if(!buf){const r=await fetch(path+(PREVIEW?'?t='+Date.now():''));if(!r.ok)return null;buf=await r.arrayBuffer()}
    return await new Promise((res)=>a.decodeAudioData(buf,res,()=>res(null)))}catch(e){return null}})()}
const BGM={id:null,src:null,gain:null,base:1};
// 音量の設定（テストプレイは別に保存。テストプレイのBGMは最初オフ）
const OPTKEY=()=>NS+(PREVIEW?'optPv':'opt');
let OPT=(()=>{const d=PREVIEW?{bgm:0,se:80}:{bgm:80,se:80};try{return Object.assign(d,JSON.parse(localStorage.getItem(OPTKEY())||'{}'))}catch(e){return d}})();
function saveOpt(){try{localStorage.setItem(OPTKEY(),JSON.stringify(OPT))}catch(e){}if(BGM.gain&&AC)BGM.gain.gain.setValueAtTime(BGM.base*OPT.bgm/100,AC.currentTime)}
function stopBgm(ms=600){const b=BGM;if(!b.src)return;const a=audioCtx(),s=b.src,g=b.gain;BGM.id=null;BGM.src=null;BGM.gain=null;
  try{const t=a.currentTime;g.gain.cancelScheduledValues(t);g.gain.setValueAtTime(g.gain.value,t);g.gain.linearRampToValueAtTime(0,t+ms/1000);s.stop(t+ms/1000+.05)}catch(e){try{s.stop()}catch(_){}}}
async function playBgm(id,vol,ms=600){
  if(!id){stopBgm(ms);return}if(BGM.id===id)return;
  const s=(G.bgms||[]).find(x=>x.id===id);if(!s){stopBgm(ms);return}
  stopBgm(ms);BGM.id=id;const buf=await loadSnd(s.file);const a=audioCtx();if(!buf||!a||BGM.id!==id)return;
  const src=a.createBufferSource(),g=a.createGain();src.buffer=buf;src.loop=true;src.connect(g).connect(a.destination);
  BGM.base=(vol==null?(s.vol??80):+vol)/100;const v=BGM.base*OPT.bgm/100,t=a.currentTime;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+ms/1000);src.start();BGM.src=src;BGM.gain=g}
async function flashScreen(c){const f=$('#flash'),ms=Math.max(60,+c.ms||400),n=Math.max(1,+c.times||1),a=(c.alpha??60)/100;f.style.background=c.color||'#ff0000';
  for(let i=0;i<n;i++){f.style.transition=`opacity ${ms/2}ms ease-out`;f.style.opacity=a;await sleep(ms/2);f.style.transition=`opacity ${ms/2}ms ease-in`;f.style.opacity=0;await sleep(ms/2)}}
async function shakeScreen(c){
  const beats=String(c.beats||'').split(/[,、\s]+/).filter(x=>x!=='').map(Number).filter(n=>!isNaN(n)&&n>=0);
  if(beats.length){const per=+c.period||0,rep=Math.max(1,+c.repeat||1),t0=performance.now(),list=[];for(let r=0;r<rep;r++)for(const b of beats)list.push(t0+r*per+b);
    for(const at of list){const d=at-performance.now();if(d>0)await sleep(d);shakeScreen({power:c.power,ms:c.ms})}
    await sleep(Math.max(0,t0+rep*per-performance.now()));return}
  const el=$('#cv'),pw=+c.power||6,ms=+c.ms||500,t0=performance.now();
  await new Promise(r=>{const step=()=>{const t=performance.now()-t0;if(t>=ms){el.style.transform='';r();return}const k=pw*(1-t/ms);el.style.transform=`translate(${Math.round((Math.random()*2-1)*k)}px,${Math.round((Math.random()*2-1)*k*.5)}px)`;requestAnimationFrame(step)};step()})}
function mapBgm(m){const v=m&&m.bgm;if(v==='-')return null;return v||(G.system&&G.system.bgm)||null}
document.addEventListener('visibilitychange',()=>{if(!AC)return;if(document.hidden)AC.suspend();else AC.resume()});
async function playSe(id,vol){const s=(G.sounds||[]).find(x=>x.id===id);if(!s)return;const b=await loadSnd(s.file);const a=audioCtx();if(!b||!a)return;
  const src=a.createBufferSource(),g=a.createGain();g.gain.value=(vol==null?100:+vol)/100*OPT.se/100;src.buffer=b;src.connect(g).connect(a.destination);src.start()}
function loadImg(path){
  if(!path)return Promise.resolve(null);
  if(imgP[path])return imgP[path];
  return imgP[path]=(async()=>{
    let src=path;
    if(PREVIEW){const f=await idbGet(path);src=f?URL.createObjectURL(new Blob([f.buf],{type:f.type||'image/png'})):path+'?t='+Date.now()}
    const im=await new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src});
    imgR[path]=im;return im;
  })();
}
const charsetOf=id=>G.charsets.find(c=>c.id===id);
function charImg(id){const c=charsetOf(id);if(!c)return null;if(!imgP[c.image])loadImg(c.image);return imgR[c.image]||null}

async function loadData(){
  if(PREVIEW){const s=localStorage.getItem(NS+'draft');if(s)return JSON.parse(s)}
  const r=await fetch('data/game.json?t='+Date.now());
  if(!r.ok)throw new Error(r.status);
  return r.json();
}
function normalize(g){
  g.tileSize=g.tileSize||32;
  for(const k of['tilesets','charsets','faces','parallaxes','pictures','stills','icons','sounds','bgms','items','maps','switches','variables'])g[k]=g[k]||[];
  g.player=g.player||{map:g.maps[0]&&g.maps[0].id,x:0,y:0,dir:0};
  g.system=Object.assign({slots:['朝','昼','夜'],startDay:1,hud:true,hudDay:{from:1,sw:-1},hudMoney:{from:1,sw:-1}},g.system||{});
  g.shop=Object.assign({count:3,limit:1,startMoney:0,pool:[]},g.shop||{});
  for(const m of g.maps){m.events=m.events||[];for(const e of m.events){e.pages=e.pages||[];for(const p of e.pages){p.cond=p.cond||[];p.cmds=p.cmds||[]}}}
}

/* ---------- 入力 ---------- */
const held=[];let aPressed=false,needRelease=false;
function press(d){if(!held.includes(d))held.push(d)}
function release(d){const i=held.indexOf(d);if(i>=0)held.splice(i,1)}
function curDir(){if(needRelease){if(!held.length)needRelease=false;return null}return held.length?held[held.length-1]:null}
const KEY={ArrowDown:0,ArrowLeft:1,ArrowRight:2,ArrowUp:3,s:0,a:1,d:2,w:3};
let dash=false;
const OK_KEYS=['Enter',' ','z','Z'],CANCEL_KEYS=['Escape','x','X','Backspace'];
// 今キーボードで操作するボタンの集まり（タイトル・メニュー・選択肢・交換機）
function navBox(){
  if($('#shop').classList.contains('show')&&!$('#shop').classList.contains('lock'))return $('#shop');
  if($('#title').style.display==='flex')return $('#title');
  if(menuOpen)return $('#menu');
  if(chEl.style.display==='flex')return chEl;
  return null}
function navBtns(box){return[...box.querySelectorAll('button')].filter(b=>!b.disabled&&b.offsetParent!==null&&!(box.id==='shop'&&b.dataset.tab))}
function navMove(box,d){const bs=navBtns(box);if(!bs.length)return;let i=bs.findIndex(b=>b.classList.contains('kf'));
  bs.forEach(b=>b.classList.remove('kf'));i=i<0?0:(i+d+bs.length)%bs.length;bs[i].classList.add('kf');bs[i].scrollIntoView({block:'nearest'})}
function navOk(box){const b=box.querySelector('button.kf');if(!b){navMove(box,0);return}
  if(box===chEl)b.dispatchEvent(new Event('pointerdown',{bubbles:true}));else b.click()}
addEventListener('keydown',e=>{
  if(e.target&&e.target.tagName==='INPUT')return;if(!$('#dbg').classList.contains('hide'))return;
  if(e.key==='Shift'){dash=true;return}
  const box=navBox();
  if(box){

  if(S.day>=(r.from||1)&&(r.to==null||r.to===''||S.day<=r.to)&&(r.slot==null||r.slot<0||r.slot===S.slot)&&(r.sw==null||r.sw<0||!!S.sw[r.sw]===(r.swv!==false))&&(r.vr==null||r.vr<0||cmpOp(S.vr[r.vr]||0,r.vop||'==',+r.vv||0)))return r.map?r:null}return null}

// 品ぞろえ表から重み付きで抽選（同じ品は1日1つ）
function drawShop(count,ex){
  const pool=G.shop.pool.filter((r,i)=>!(ex&&ex.has(i))&&G.items.some(it=>it.id===r.item)&&S.day>=(r.from||1)&&(r.to==null||r.to===''||S.day<=r.to)&&(r.sw==null||r.sw<0||S.sw[r.sw])&&!(r.once&&S.once[i])&&!(r.showOnce&&S.shown&&S.shown[i]));
  const out=[];
  // 必ず並ぶ日（日付の数字、または変数に入った日付）
  pool.forEach(r=>{const fd=r.forceVar!=null&&r.forceVar>=0?(S.vr[r.forceVar]||0):(+r.forceDay||0);if(fd&&S.day===fd)out.push({p:G.shop.pool.indexOf(r),sold:false})});
  const forced=new Set(out.map(o=>o.p)),cand=pool.filter(r=>!forced.has(G.shop.pool.indexOf(r))).map(r=>{const i=G.shop.pool.indexOf(r);let w=Math.max(0,r.weight==null?1:+r.weight);if(S.wish!=null&&S.wish.p===i)w=Math.max(w,1)*(+S.wish.mult||10);return{r,w}}).filter(c=>c.w>0);
  for(let n=out.length;n<(count??(G.shop.count||3))&&cand.length;n++){const tot=cand.reduce((a,c)=>a+c.w,0);let x=Math.random()*tot,k=0;for(;k<cand.length-1;k++){x-=cand[k].w;if(x<0)break}
    out.push({p:G.shop.pool.indexOf(cand[k].r),sold:false});cand.splice(k,1)}
  // 「一度並んだらもう並ばない」品は、数え始めの日以降に並んだら記録
  if(S.day>=(+G.shop.noRepeatFrom||1)){S.shown=S.shown||{};for(const o of out)if(G.shop.pool[o.p].showOnce)S.shown[o.p]=true}
  return out;
}

// opt.fixed: [{item,price}] 今日の品ぞろえの代わりに並べる / opt.sell: [itemId] いれるに出す物を限定 / opt.tutorial: 'buy'|'sell' 手順つき / opt.view: 見せるだけ

  const stock=opt.fixed?opt.fixed.map(r=>({r:Object.assign({price:0},r),sold:false})):S.shop.map(sl=>({r:G.shop.pool[sl.p],sl,get sold(){return sl.sold}}));

        const c=card(it,it.name,(it.desc||'')+(r.limitUp?`（取り出し回数+${r.limitUp}）`:''),o.sold?'交換済み':`価値 ${r.price}`,'b'+i,o.sold);

  }

function evalCond(c,cx){
  switch(c.type){
    case'sw':return !!S.sw[c.id]===!!c.val;
    case'var':{const a=S.vr[c.id]||0,b=c.ref!=null&&c.ref>=0?(S.vr[c.ref]||0):(+c.val||0);return c.op==='=='?a===b:c.op==='!='?a!==b:c.op==='>='?a>=b:c.op==='<='?a<=b:c.op==='>'?a>b:a<b}
    case'item':return((S.it[c.id]||0)>0)===!!c.has;
    case'self':return !!S.ss[cx.ev.home+':'+cx.ev.d.id+':'+c.key]===!!c.val;
    case'day':case'money':{const a=c.type==='day'?S.day:S.money,b=+c.val||0;return c.op==='=='?a===b:c.op==='!='?a!==b:c.op==='>='?a>=b:c.op==='<='?a<=b:c.op==='>'?a>b:a<b}
    case'slot':return(S.slot===+c.val)===(c.op!=='!=');
    case'pdir':return P.dir===+c.val;
    case'ppos':{const a=c.axis==='x'?P.x:P.y,b=+c.val||0;return c.op==='=='?a===b:c.op==='!='?a!==b:c.op==='>='?a>=b:c.op==='<='?a<=b:c.op==='>'?a>b:a<b}
  }

}

async function exec(list,cx){for(const c of list||[])await cmd(c,cx)}
async function cmd(c,cx){

      const names=[...new Set(L.map(o=>o.it.name))],pick=names.map(n=>L.find(o=>o.it.name===n));
      hideMsg();const k=await showChoice([...names,'やめる']);if(k<names.length){S.wish={p:pick[k].i,mult:+c.mult||10};await showText({name:'',text:(c.text||'「{item}」が明日並ぶように祈った。').replace('{item}',names[k]),pic:'-'})}break}
    case'gift':{const L=G.items.filter(it=>it.gift!==false&&(S.it[it.id]||0)>0);let got=0;
      if(!L.length){await showText({name:'',text:c.none||'渡せる物を持っていない。'})}
      else{hideMsg();const i=await showChoice([...L.map(it=>`${it.name}（${S.it[it.id]}）`),'やめる']);if(i<L.length){got=L[i].id;if(c.take!==false)S.it[got]--}}
      S.vr[c.var??12]=got;break}
    case'if':await exec(evalCond(c.cond,cx)?c.then:(c.hasElse?c.else:[]),cx);break;
    case'vcase':{const v=c.src==='day'?S.day:c.src==='slot'?S.slot:(S.vr[c.id]||0),k=(c.cases||[]).find(x=>+x.val===v);await exec(k?k.cmds:(c.hasElse?c.else:[]),cx);break}
    case'random':{const o=c.options||[];if(o.length)await exec(o[Math.floor(Math.random()*o.length)].cmds,cx);break}

    P.py+=Math.sign(gy-P.py)*Math.min(sp,Math.abs(gy-P.py));

/* ---------- メニュー・タイトル ---------- */
function memoOn(){const M=G.system&&G.system.memo;return !!(M&&S&&(M.sw==null||M.sw<0||S.sw[M.sw]))}
function toggleMenu(v){menuOpen=v==null?!menuOpen:v;$('#menu').style.display=menuOpen?'flex':'none';$('#items').style.display='none';$('#menu [data-m=memo]').style.display=memoOn()?'':'none';if(menuOpen){$('#menu').querySelectorAll('.kf').forEach(b=>b.classList.remove('kf'));navMove($('#menu'),0)}}
$('#menuBtn').addEventListener('click',()=>toggleMenu(true));
$('#menu').addEventListener('click',e=>{
  const m=e.target.dataset&&e.target.dataset.m;if(!m)return;
  if(m==='close')toggleMenu(false);
  if(m==='items'){const it=$('#items');const own=G.items.filter(i=>(S.it[i.id]||0)>0);it.innerHTML='';
    it.textContent='';const hd=document.createElement('div');hd.textContent=hudText();if(!hd.textContent)hd.style.display='none';hd.style.cssText='border-bottom:1px solid #fff;margin-bottom:4px';it.append(hd);
    if(!own.length)it.append('なにも持っていない');
    for(const i of own){const d=document.createElement('div');d.textContent=`${i.name} ×${S.it[i.id]}`+(i.desc?`　${i.desc}`:'');it.append(d)}
    it.style.display='block'}
  if(m==='save'){S.x=P.x;S.y=P.y;S.dir=P.dir;localStorage.setItem(SAVEKEY,JSON.stringify(S));e.target.textContent='セーブしました';setTimeout(()=>e.target.textContent='セーブ',1200)}
  if(m==='memo'){const M=G.system.memo,it=$('#items');it.innerHTML='';const hd=document.createElement('div');hd.textContent=M.title||'メモ';hd.style.cssText='border-bottom:1px solid #fff;margin-bottom:4px';it.append(hd);
    for(const L of M.lines||[]){const d=document.createElement('div');const done=L.sw!=null&&L.sw>=0&&S.sw[L.sw];d.textContent=(done?'☑ ':'☐ ')+L.text+(done&&L.doneText?`　${L.doneText}`:'');if(done)d.style.opacity=.6;it.append(d)}
    it.style.display='block'}
  if(m==='load')loadGame();
  if(m==='opt'){const it=$('#items');it.innerHTML='';const row=(lab,k)=>{const d=document.createElement('div');d.style.cssText='display:flex;align-items:center;gap:10px;margin:6px 0';
      const s=document.createElement('input');s.type='range';s.min=0;s.max=100;s.step=10;s.value=OPT[k];s.style.flex='1';const v=document.createElement('span');v.style.cssText='width:44px;text-align:right';
      const show=()=>v.textContent=+s.value?s.value:'オフ';show();s.oninput=()=>{OPT[k]=+s.value;show();saveOpt()};const l=document.createElement('span');l.textContent=lab;l.style.width='3em';d.append(l,s,v);return d};
    it.append(row('BGM','bgm'),row('効果音','se'));if(PREVIEW){const n=document.createElement('div');n.style.cssText='font-size:12px;color:#aab';n.textContent='テストプレイの設定は、ふつうに遊ぶときとは別に保存されます';it.append(n)}
    it.style.display='block'}
});
async function loadGame(){const s=localStorage.getItem(SAVEKEY);if(!s){alert('セーブデータがありません');return}S=JSON.parse(s);S=Object.assign({once:{},day:1,slot:0,money:0,buys:0,buyLimit:+G.shop.limit||1},S);if(!S.shop)S.shop=drawShop();toggleMenu(false);$('#title').style.display='none';await fade(1);await loadMap(S.map,S.x,S.y,S.dir);await fade(0)}
async function startNew(){
  const p=G.player;S={map:p.map,x:p.x,y:p.y,dir:p.dir||0,sw:{},vr:{},it:{},ss:{},once:{},day:G.system.startDay||1,slot:0,money:+G.shop.startMoney||0,buys:0,buyLimit:+G.shop.limit||1};S.shop=drawShop();
  for(const [k,v] of Object.entries((G.system&&G.system.varCfg)||{})){if(!v)continue;if(v.init!=null&&v.init!=='')S.vr[k]=+v.init;if(v.pick){const L=String(v.pick).split(/[,、\s]+/).filter(x=>x!=='').map(Number);if(L.length)S.vr[k]=L[Math.floor(Math.random()*L.length)]}}
  if(PREVIEW&&Q.has('map')){S.map=+Q.get('map');S.x=+Q.get('x')||0;S.y=+Q.get('y')||0}
  await loadMap(S.map,S.x,S.y,S.dir);
}
function showTitle(){stopBgm(300);
  $('#ttl').textContent=G.title||'';$('#title').style.display='flex';
  $('#tCont').classList.toggle('hide',!localStorage.getItem(SAVEKEY));
  $('#tNew').onclick=async()=>{$('#title').style.display='none';await startNew()};
  $('#tCont').onclick=loadGame;
  $('#title').querySelectorAll('.kf').forEach(b=>b.classList.remove('kf'));navMove($('#title'),0);
}
(async()=>{
  try{G=await loadData()}catch(e){document.body.innerHTML='<p style="padding:20px;color:#fff">data/game.json を読み込めませんでした。</p>';return}
  normalize(G);document.title=G.title||'RPG';resize();
  for(const c of G.charsets)loadImg(c.image);
  loop();
  // テストプレイ：エディタに戻るボタン（タブを閉じる。閉じられなければエディタを開く）
  if(PREVIEW){const b=$('#pvBack');b.classList.remove('hide');b.onclick=()=>{window.close();setTimeout(()=>location.href='editor.html',300)}}
  if(PREVIEW){$('#dbgBtn').classList.remove('hide');$('#dbgBtn').onclick=openDbg}
  if(PREVIEW)startNew();else showTitle();
})();
// ===== デバッグ（テストプレイ専用）=====
const DBGKEY=NS+'dbgsnaps';
function dbgSnaps(){try{return JSON.parse(localStorage.getItem(DBGKEY)||'[]')}catch(e){return[]}}
function dbgSetSnaps(a){try{localStorage.setItem(DBGKEY,JSON.stringify(a))}catch(e){}}
function openDbg(){
  if(busy||!S)return;S.x=P.x;S.y=P.y;S.dir=P.dir;
  const D=$('#dbg');D.innerHTML='';D.classList.remove('hide');
  const el=(t,a={},...k)=>{const e=document.createElement(t);for(const x in a){if(x.startsWith('on'))e[x]=a[x];else e.setAttribute(x,a[x])}e.append(...k);return e};
  const W={sw:{},vr:{}};
  const close=()=>{D.classList.add('hide');D.innerHTML=''};
  const apply=async()=>{
    for(const i in W.sw)S.sw[i]=W.sw[i].checked;
    for(const i in W.vr)S.vr[i]=parseInt(W.vr[i].value,10)||0;
    S.day=Math.max(1,parseInt(W.day.value,10)||1);S.slot=+W.slot.value;S.money=parseInt(W.money.value,10)||0;
    S.pname=W.pname.value.trim()||undefined;
    const m=+W.map.value,x=parseInt(W.x.value,10),y=parseInt(W.y.value,10);
    close();await fade(1);await loadMap(m,isNaN(x)?0:x,isNaN(y)?0:y,S.dir);updHud();await fade(0);
  };
  D.append(el('div',{class:'top'},el('button',{class:'ui-btn',onclick:apply},'✓ 反映してこの場所から再開'),el('button',{class:'ui-btn',onclick:close},'閉じる')));
  // スナップショット
  {const L=sanityList();if(L.length){D.append(el('h3',{},'正気度'));const box=el('div',{style:'display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px'});
    for(const [n,v] of L)box.append(el('div',{style:`background:#1a1c36;border-radius:8px;padding:6px 8px;text-align:center;${v<=0?'outline:2px solid #e66':''}`},el('div',{style:'font-size:12px;color:#aab'},n),el('div',{style:'font-size:20px;font-weight:bold'},String(v))));
    D.append(box);const cb=el('input',{type:'checkbox'});try{cb.checked=localStorage.getItem(NS+'dbgSan')==='1'}catch(e){}
    cb.onchange=()=>{try{localStorage.setItem(NS+'dbgSan',cb.checked?'1':'0')}catch(e){}updDbgHud()};
    D.append(el('label',{class:'r'},el('span',{},'テスト中ずっと画面の左上に表示する'),cb))}}
  D.append(el('h3',{},'状態の保存（進行度ごとのセーブ）'));
  const sn=el('div');D.append(sn);
  const drawSn=()=>{sn.innerHTML='';const a=dbgSnaps();
    a.forEach((s,i)=>sn.append(el('div',{class:'r'},el('span',{},s.name),
      el('button',{class:'ui-btn',onclick:async()=>{S=JSON.parse(JSON.stringify(s.S));if(!S.shop)S.shop=drawShop();close();await fade(1);await loadMap(S.map,S.x,S.y,S.dir);updHud();await fade(0)}},'読込'),
      el('button',{class:'ui-btn',onclick:()=>{if(confirm(`「${s.name}」を削除しますか？`)){a.splice(i,1);dbgSetSnaps(a);drawSn()}}},'✕'))));
    if(!a.length)sn.append(el('div',{style:'color:#889;font-size:13px'},'まだありません。今の状態に名前をつけて保存すると、次のテストプレイからすぐそこへ飛べます'));
    sn.append(el('div',{class:'r'},el('button',{class:'ui-btn',onclick:()=>{const n=prompt('名前（例：進行度3 警告音を止めた後）',`進行度${S.vr[5]||0} ${S.day}日目`);if(!n)return;a.push({name:n,S:JSON.parse(JSON.stringify(S))});dbgSetSnaps(a);drawSn()}},'＋ 今の状態を保存')));
  };drawSn();
  // 場所
  D.append(el('h3',{},'場所'));
  W.map=el('select');for(const m of G.maps){const o=el('option',{value:m.id},`${m.id}: ${m.name}`);if(m.id===S.map)o.selected=true;W.map.append(o)}
  W.x=el('input',{type:'number',value:P.x});W.y=el('input',{type:'number',value:P.y});
  D.append(el('div',{class:'r'},W.map),el('div',{class:'r'},el('span',{},'X'),W.x,el('span',{},'Y'),W.y));
  // 日付
  D.append(el('h3',{},'日付・時間帯・価値・名前'));
  W.day=el('input',{type:'number',value:S.day});W.slot=el('select');(G.system.slots||[]).forEach((n,i)=>{const o=el('option',{value:i},n);if(i===S.slot)o.selected=true;W.slot.append(o)});
  W.money=el('input',{type:'number',value:S.money});W.pname=el('input',{type:'text',value:S.pname||'',placeholder:'未入力'});
  D.append(el('div',{class:'r'},el('span',{},'日'),W.day,W.slot),el('div',{class:'r'},el('span',{},'価値'),W.money),el('div',{class:'r'},el('span',{},'主人公の名前'),W.pname));
  // 変数・スイッチ（名前のあるものだけ）
  D.append(el('h3',{},'変数'));
  G.variables.forEach((n,i)=>{if(!n)return;W.vr[i]=el('input',{type:'number',value:S.vr[i]||0});D.append(el('div',{class:'r'},el('span',{},`${i}: ${n}`),W.vr[i]))});
  D.append(el('h3',{},'スイッチ'));
  G.switches.forEach((n,i)=>{if(!n)return;W.sw[i]=el('input',{type:'checkbox'});W.sw[i].checked=!!S.sw[i];D.append(el('label',{class:'r'},el('span',{},`${i}: ${n}`),W.sw[i]))});
}
</script>
